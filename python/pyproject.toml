[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
# Published on PyPI as `mnemo-db` because `mnemo` (a 2021 notebook
# project) holds the unqualified name. The Python package directory,
# import path, and SDK class names stay `mnemo` / `MnemoClient` — only
# the PyPI distribution name moves. Users do `pip install mnemo-db`
# then `from mnemo import MnemoClient`.
name = "mnemo-db"
# LOCKED to the Rust workspace `[workspace.package].version`. This is NOT an
# independently-versioned artifact, unlike the TypeScript and Go SDKs.
#
# Why the difference: those two are thin MCP-over-STDIO clients that embed
# nothing, so their version describes the client. This package is PyO3 bindings
# that COMPILE mnemo-core into the wheel (see python/Cargo.toml, which already
# has `version.workspace = true`), so `pip install mnemo-db` ships an engine and
# the wheel version has to say which engine.
#
# The previous "versioned independently" comment produced exactly the bug you
# would predict: the wheel metadata said 0.5.12 while the compiled core inside it
# was 0.5.23. Fenced now by workspace_version_fence.rs.
version = "0.5.28"
description = "MCP-native memory database for AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = [
    "mnemo",
    "mcp",
    "memory",
    "ai",
    "agent",
    "llm",
    "vector",
    "embeddings",
    "knowledge-graph",
    "duckdb",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/sattyamjjain/mnemo"
Repository = "https://github.com/sattyamjjain/mnemo"
Documentation = "https://github.com/sattyamjjain/mnemo#readme"
"Bug Tracker" = "https://github.com/sattyamjjain/mnemo/issues"
Changelog = "https://github.com/sattyamjjain/mnemo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
langgraph = ["langgraph-checkpoint>=0.2"]
crewai = ["crewai>=0.40"]
openai-agents = ["openai-agents>=0.1"]
claude = ["claude-agent-sdk>=0.1", "watchdog>=4.0"]
# Workspace backends for the OpenAI Agents SDK GA snapshot store. All four
# are real as of #39; each pulls only its own provider SDK plus `cryptography`
# for the shared Ed25519 manifest signing.
#   s3    -> boto3            (AWS)
#   r2    -> boto3            (Cloudflare R2 is S3-wire-compatible; subclasses S3Workspace)
#   gcs   -> google-cloud-storage   (standalone; GCS is NOT S3-wire-compatible)
#   azure -> azure-storage-blob     (standalone; Azure Blob is NOT S3-wire-compatible)
"openai-sandbox-s3" = ["boto3>=1.34", "cryptography>=42"]
"openai-sandbox-r2" = ["boto3>=1.34", "cryptography>=42"]
"openai-sandbox-gcs" = ["google-cloud-storage>=2.14", "cryptography>=42"]
"openai-sandbox-azure" = ["azure-storage-blob>=12.19", "cryptography>=42"]
"anthropic-memory-tool" = ["anthropic>=0.40"]
benchmark = ["datasets>=4.0"]
# `moto` fakes S3 for the s3/r2 backends; GCS and Azure have no moto
# equivalent, so their tests use in-process fakes and only need the
# provider SDK importable for the module-level import guard.
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "moto>=5.0",
       "google-cloud-storage>=2.14", "azure-storage-blob>=12.19"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "mnemo._mnemo"
