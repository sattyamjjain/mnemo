[[clause]]
id = "non-revival"
name = "Non-revival after retraction or deletion"
status = "conflicts"
statement = "Once retracted or deleted, a record can never again support an outgoing claim."
why_absent = """
mnemo has soft delete, `forget_subject` redact / hard-delete, and TTL sweeps, but no \
non-revival guarantee.\
"""
notes = """
mnemo has soft delete, `forget_subject` redact / hard-delete, and TTL sweeps. It has \
**no non-revival guarantee**: point-in-time `as_of` recall deliberately skips the \
deleted check (`passes_filters` in \
[`query/recall.rs`](../../crates/mnemo-core/src/query/recall.rs) reads \
`if request.as_of.is_none() && record.is_deleted()`), so a deleted record is reachable \
again by design. That is a defensible audit feature and a direct violation of this \
clause.\
"""
implementation = []

# The clause is not merely unimplemented — it is in direct conflict with a
# shipped, deliberate feature. If `as_of` recall ever stops surfacing deleted
# records, this entry is wrong and the test must fail rather than let the
# markdown keep asserting a conflict that no longer exists.
[clause.conflicts_with]
feature = "`as_of` point-in-time recall"
path = "crates/mnemo-core/src/query/recall.rs"
symbol = "request.as_of.is_none() && record.is_deleted()"
detail = "`as_of` recall deliberately surfaces deleted records, which is exactly what non-revival forbids. One of the two has to give."

