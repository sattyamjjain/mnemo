[[clause]]
id = "ledger-integrity"
name = "Ledger integrity"
status = "ships"
statement = "The write log is append-only and tamper-evident, verifiable without trusting the store."
notes = """
SHA-256 hash-chained `agent_events` with an offline verifier that needs no trust \
in the store. Measured: **100% single-byte-mutation detection over 256 trials** \
([`bench/audit_conformance`](../../bench/audit_conformance)), and delete / reorder / \
forge-integrity-field each 100% over 200 trials \
([`bench/audit_tamper`](../../bench/audit_tamper)), with two **disclosed 0% gaps** — \
payload-only forge and tail truncation. This is the one clause where mnemo is on \
comparable ground.\
"""
implementation = [
  { path = "crates/mnemo-core/src/hash.rs", symbol = "verify_event_chain" },
  { path = "crates/mnemo-core/src/query/mod.rs", symbol = "verify_event_integrity" },
]

[[clause]]
id = "source-binding"
name = "Source binding"
status = "partial"
statement = "A record's admission is bound to the source that produced it, rather than accepted as undifferentiated content."
weakness = "not admission-controlling, and not tamper-proof in the way the clause requires"
notes = """
[`WriteProvenance`](../../crates/mnemo-core/src/model/write_provenance.rs) binds every \
`REMEMBER` / `SHARE` to a principal, capability and session over a SHA-256 chain, and \
`SourceType` records an origin. **But the binding is not admission-controlling and not \
tamper-proof in the way the clause requires**: `source_type` is optional, defaults to \
`Agent`, is not covered by the content hash, and does not appear in the read receipt — \
so a tool return is **not provably separable from user input**. That limitation is \
already written down in \
[`docs/security/read-time-provenance.md`](../security/read-time-provenance.md); GPM is \
the paper that says why it matters.\
"""
implementation = [
  { path = "crates/mnemo-core/src/model/write_provenance.rs", symbol = "WriteProvenance" },
  { path = "crates/mnemo-core/src/provenance.rs", symbol = "ProvenanceSigner" },
]

[[clause]]
