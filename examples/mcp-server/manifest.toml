# Example manifest for `mnemo mcp-server --manifest <path>` (v0.4.0-rc3, B2).
#
# This is the ONLY surface that grants capabilities to the hardened
# binary. Anything you would otherwise pass as `--config-json` /
# environment trickery has to land here, on a chmod-restricted file
# that you control.
#
# Threat model: defends against the OX-MCP "exfiltrate-then-act"
# disclosure (2026-04-24). The binary refuses to start if the parent
# process leaks sensitive env vars (ANTHROPIC_API_KEY, OPENAI_API_KEY,
# AWS_SECRET_ACCESS_KEY, etc.) into our env, if argv carries
# JSON-injection patterns like `--config`, or if a non-TTY parent
# process is not in `allowed_parents`.

# Path to the HMAC keystore used by the provenance signer (B1). The
# file is a tiny TOML with `key_id = "..."` and `key_hex = "..."`
# (>= 32 raw bytes, hex-encoded). Rotate by writing a new file and
# pointing the manifest at it.
keystore_path = "/etc/mnemo/keystore.toml"

# Where the append-only audit log should land. Future B4 work will
# append every write here with a per-write consent token.
audit_log_path = "/var/log/mnemo/audit.jsonl"

# Tools the MCP server is allowed to expose. Anything not listed here
# is filtered out at the server boundary. The default is the
# minimum-blast-radius pair `mnemo.recall + mnemo.verify`.
allowed_tools = ["mnemo.recall", "mnemo.verify"]

# Agents allowed to run against this binary. Empty set means "any
# agent". The agent_id passed via `--agent-id` / `MNEMO_AGENT_ID` must
# be in this set when it is non-empty.
allowed_agents = ["claude-prod", "claude-stage"]

# Parent process basenames trusted to spawn the binary in non-TTY
# mode. Set the parent name from your launcher via
# `MNEMO_PARENT_BASENAME=<name>`. Running interactively (TTY present)
# bypasses this check.
allowed_parents = ["claude", "claude-code", "systemd", "supervisord"]

# v0.4.0 (P0-1) — Optional serve-time MCP tool-catalog attestation
# (arXiv 2604.20994: function-hijacking via tool-catalog poisoning). When
# `tool_catalog_pin_path` is set, `mnemo mcp-server` fingerprints the tools it
# is about to advertise (after any [role_filter]) and compares them to the pin
# BEFORE serving stdio: it refuses to start on any added/mutated tool, and on a
# removed-only downgrade unless `allow_removed_drift = true`. Every verdict is
# recorded as an `mcp_tool_catalog_drift` audit event. Generate the pin for your
# exact binary (regenerate it after every mnemo upgrade), then commit it
# chmod-restricted next to the keystore:
#
#   mnemo mcp-server --manifest ./manifest.toml --print-catalog-pin > tool_catalog.pin.toml
#
# tool_catalog_pin_path = "/etc/mnemo/tool_catalog.pin.toml"
# allow_removed_drift   = false   # true only for an intentional tool-removal downgrade

# v0.4.2 (A1) — Optional MCP role-aware tool filter aligned with the
# 2025-11-25 MCP authorization spec (role-based annotations,
# https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization).
#
# When this `[role_filter]` block is omitted, every advertised tool
# stays reachable and no audit events are emitted (byte-for-byte
# pre-v0.4.2 behaviour).
#
# When present:
#   - `caller_roles` is the role list the operator has assigned to the
#     binary's caller-context. In stdio transport this represents the
#     single caller (the launching process); in a future HTTP transport
#     it would be inferred from the `Authorization` header.
#   - `default` is `"allow_all"` (default) or `"deny_all"`. Use
#     `deny_all` to turn the filter into a strict allow-list.
#   - `allow` maps each tool name to the roles that can call it.
#   - `deny` maps each tool name to the roles that CANNOT call it.
#   - Deny always wins over allow.
#
# Every denied call emits an `McpRoleDenied { caller_id, tool_name,
# attempted_at, reason }` audit row to `audit_log_path`.
#
# [role_filter]
# caller_roles = ["auditor"]
# default = "deny_all"
#
# [role_filter.allow]
# "mnemo.recall" = ["auditor", "agent"]
# "mnemo.verify" = ["auditor"]
# "mnemo.remember" = ["agent"]
# "mnemo.forget"   = ["agent"]
#
# [role_filter.deny]
# "mnemo.delegate" = ["auditor"]
