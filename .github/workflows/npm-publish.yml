name: npm-publish

# Auto-deploy @mndfreek/mnemo-sdk to npm on push to main, gated by
# version-changed.
#
# Trigger model
#   - push to main: runs, but only publishes if
#     `sdks/typescript/package.json`'s version doesn't already exist on
#     npm. Doc-only commits no-op.
#   - workflow_dispatch: manual trigger.
#
# Why this design
#   npm rejects republishing the same version (immutable). The
#   precheck makes the workflow idempotent.
#
# Auth
#   NPM_TOKEN repo secret (granular access token with @mndfreek/* write
#   + 2FA bypass enabled). npm's full-OIDC trusted publisher exists but
#   is younger than PyPI's; reassess in a release or two.
#
# Provenance attestation
#   `--provenance` ties the published artefact cryptographically to
#   this exact GitHub Actions run. Visible on the npm page.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  plan:
    if: github.repository == 'sattyamjjain/mnemo'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Check if package.json version is already on npm
        id: check
        run: |
          ver=$(node -p 'require("./sdks/typescript/package.json").version')
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          if npm view "@mndfreek/mnemo-sdk@${ver}" version >/dev/null 2>&1; then
            echo "@mndfreek/mnemo-sdk@${ver} already on npm — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@mndfreek/mnemo-sdk@${ver} not on npm — will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: plan
    if: needs.plan.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mndfreek/mnemo-sdk
    permissions:
      id-token: write   # for npm provenance attestation
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # --- Token preflight (fail fast, fail loud) ---------------------------
      # 0.4.5–0.4.8 never reached npm even though package.json advanced: every
      # push built the tarball, ran the tests, type-checked, AND signed a
      # provenance statement to the public transparency log — then the final
      # `npm publish` PUT died with a bare `404 Not Found`. For a SCOPED package
      # that already exists, npm returns 404 (not 401/403) when the token is
      # missing/expired or lacks write on the scope, to avoid disclosing the
      # package to unauthorized callers. A bad token is an OPERATOR action, not a
      # transient error — validate it up front, before building or signing
      # anything, with an explicit, actionable message.
      - name: Verify NPM_TOKEN is present and accepted by npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            {
              echo "## ❌ npm publish aborted — token problem"
              echo
              echo "$1"
              echo
              echo "**Operator action required** (no code change fixes this):"
              echo "1. Create a granular access token at <https://www.npmjs.com/settings/~/tokens> with **write** access to \`@mndfreek/*\` (2FA bypass for automation)."
              echo "2. Update the repo secret \`NPM_TOKEN\` (Settings → Secrets and variables → Actions)."
              echo "3. Re-run this workflow (or push to main again)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            fail "NPM_TOKEN is MISSING (the repo secret is empty)."
          fi
          # `npm whoami` returns the username for a valid token and errors for a
          # missing/expired/revoked one — validating WITHOUT publishing.
          if ! who=$(npm whoami --registry=https://registry.npmjs.org/ 2>&1); then
            fail "NPM_TOKEN is present but npm rejected it (npm whoami -> ${who}). This is the exact failure that stranded 0.4.5-0.4.8: a 404 on the scoped-package PUT after the tarball was built and provenance signed."
          fi
          echo "npm token accepted (whoami -> ${who}). Proceeding to publish."

      - name: Install
        working-directory: sdks/typescript
        run: npm ci

      - name: Test
        working-directory: sdks/typescript
        run: npm test

      - name: Type-check + build
        working-directory: sdks/typescript
        run: |
          npx tsc --noEmit
          npm run build

      - name: Publish
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Prerelease versions (with a hyphen, e.g. 0.4.0-rc2) ship to
          # the `rc` dist-tag so `npm install @mndfreek/mnemo-sdk` keeps
          # resolving to the latest stable. Stable versions ship to
          # `latest` (the default).
          ver=$(node -p 'require("./package.json").version')
          if [[ "$ver" == *-* ]]; then
            npm publish --access public --provenance --tag rc
          else
            npm publish --access public --provenance
          fi
