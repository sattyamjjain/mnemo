name: release-crate

# Publish the 0.5.x **library line** to crates.io on a `v*.*.*` tag.
#
# Scope — the importable set a user needs to run auditable memory AND the
# Postgres/REST/gRPC backends the README documents, published in dependency
# order:
#
#     mnemo-core → mnemo-graph → mnemo-attention-state → mnemo-compliance →
#     mnemo-mcp → mnemo-postgres → mnemo-rest → mnemo-grpc → (leaf) mnemo-db
#
# The four backend crates (graph, postgres, rest, grpc) were added here after
# they stranded at 0.4.4/0.4.5: this tag-gated path was originally the
# compliance line only, so `cargo add mnemo-postgres` kept resolving a
# 2-month-old version with none of the v0.5.7 (#99) real pgvector ANN or v0.5.18
# async VectorIndex work. Keeping them in THIS workflow (not just
# cargo-publish.yml, whose workspace-wide build the golem-wit WASM link failure
# reddens) means a tag ships the whole line — PROVIDED the registry token is
# valid.
#
# STATUS (2026-08-14): SHIPPED. v0.5.23 published the whole line, including
# `mnemo-mcp-server` (stranded at 0.4.4 for 87 days) and the then-new
# `mnemo-embeddings-bench`. `cargo add mnemo-mcp-server` resolves 0.5.23. #140 is
# closed.
#
# The long-held diagnosis was WRONG and is corrected here so nobody re-derives
# it: the token was never the blocker. It carries BOTH publish-update AND
# publish-new (it created mnemo-embeddings-bench on the first real attempt). The
# earlier 403s on /api/v1/me were a GRANULAR token lacking account-read scope —
# advisory, not fatal — which is why the preflight below only hard-fails on a
# MISSING secret. What actually blocked v0.5.23 was procedural: no `v0.5.23` tag
# and no `## [0.5.23]` CHANGELOG heading (the cargo-publish gate), plus the
# new-crate gate below needing explicit publish-new confirmation.
#
# IMPORTANT for the next release: repo variable RELEASE_TOKEN_HAS_PUBLISH_NEW is
# NOT set, so a bare tag push ABORTS at the new-crate gate whenever the walk
# contains a crate that does not exist yet. Dispatch it instead:
#     gh workflow run release-crate.yml --ref vX.Y.Z -f confirm_publish_new=true
#
# `mnemo-attention-state` is in the set because `mnemo-mcp` hard-depends on it
# (server.rs uses `mnemo_attention_state::AttentionStateStore`); it was
# introduced after the last 0.4.4 crates.io publish, so it must be published for
# `mnemo-mcp` to resolve.
#
# Plus a fifth leaf crate, `mnemo-db` — a dependency-free name-reservation
# pointer that redirects Rust users to mnemo-core/mnemo-mcp (the unqualified
# `mnemo` name on crates.io is an unrelated project). It has no internal deps, so
# it publishes independently; on an unchanged workspace version the four crates
# above 404-gate as already-present and only mnemo-db is newly published.
#
# Why a separate, tag-gated workflow (vs. cargo-publish.yml's push-to-main run):
#   - It gates on ONLY the publish closure, so the pre-existing golem-wit WASM
#     link failure (which reddens the workspace-wide build in cargo-publish.yml)
#     cannot block a release of these four crates.
#   - It publishes in the CORRECT dependency order (core before its dependents;
#     compliance before mcp) — cargo-publish.yml lists mcp before compliance.
#   - A tag is an explicit, intentional release trigger; a docs push is not.
#
# Prerequisites
#   - CARGO_REGISTRY_TOKEN repo secret (already configured for cargo-publish.yml).
#   - Every internal path dep in the root Cargo.toml carries `version` alongside
#     `path` (required for `cargo publish` to accept it).
#
# Idempotency: crates.io publishes are PERMANENT. Each crate publishes only if
# its version is not already on crates.io (404 check), so re-running a tag is a
# safe no-op for crates already up.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (package + verify, no upload)"
        type: boolean
        default: false
      confirm_publish_new:
        description: "I confirm CARGO_REGISTRY_TOKEN carries the publish-new scope (required to CREATE a new crate). Leave unchecked and the run fails early if the walk contains a new crate."
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate (fmt + clippy + tests, publish closure)
    if: github.repository == 'sattyamjjain/mnemo'
    runs-on: ubuntu-latest
    # 90, not 30. The v0.5.24 tag run died here: on a COLD cache the closure
    # needs ~12m for clippy alone (duckdb-bundled, tantivy, sqlx, tonic all
    # compile from source), and `Test` was still running at 17m41s when the 30m
    # cap cancelled the job — so `publish` skipped and the release silently did
    # not happen. This is a budget problem, not a hang: no step was stuck.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # `cache-on-failure` is what makes a retry cheaper than the first attempt.
      # By default rust-cache saves only on success, and the post-step is SKIPPED
      # outright when a job is cancelled — so the timed-out v0.5.24 run persisted
      # nothing and a plain re-run would have started cold and hit the same wall.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `mnemo-grpc` (in the publish closure since v0.5.20) has a prost build
      # script that shells out to `protoc`; without it clippy/test fail before
      # any publish.
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Format is a whole-repo invariant and cheap.
      - run: cargo fmt --all -- --check
      # Clippy + tests are scoped to the crates being published (and their
      # transitive deps, pulled automatically) so an unrelated, pre-existing
      # WASM/golem link failure elsewhere in the workspace can never gate a
      # release of this compliance line. `-D warnings` matches CI.
      - name: Clippy (publish closure)
        run: |
          cargo clippy --all-targets \
            -p mnemo-core -p mnemo-graph -p mnemo-attention-state \
            -p mnemo-compliance -p mnemo-mcp \
            -p mnemo-postgres -p mnemo-rest -p mnemo-grpc -p mnemo-amp -p mnemo-db \
            -p mnemo-embeddings-bench -p mnemo-mcp-server -- -D warnings
      # Full closure test suite. The recall-QUALITY benchmark
      # `domain_scoped_dilution` was made platform-robust (its "flat P@10 should
      # degrade" assertion now accepts the floor case where the approximate HNSW
      # surfaces no gold in top-k on some platforms — e.g. flat P@10 = 0 at every
      # corpus size on Linux; the headline "scoped beats flat by >= 0.05" claim is
      # still asserted), so the gate runs the whole suite with no skips.
      - name: Test (publish closure)
        run: |
          cargo test \
            -p mnemo-core -p mnemo-graph -p mnemo-attention-state \
            -p mnemo-compliance -p mnemo-mcp \
            -p mnemo-postgres -p mnemo-rest -p mnemo-grpc -p mnemo-amp -p mnemo-db \
            -p mnemo-embeddings-bench -p mnemo-mcp-server

  publish:
    name: Publish to crates.io
    needs: gate
    if: github.repository == 'sattyamjjain/mnemo'
    runs-on: ubuntu-latest
    # The v0.5.20 closure grew from the 5-crate compliance line to 9 crates, each
    # verify-built TWICE (coordinated dry-run + real publish) plus 60s crates.io
    # index-propagation waits between dependency tiers. 45 min timed out on the
    # dry-run alone; give the full walk generous headroom.
    timeout-minutes: 180
    environment:
      name: crates-io
      url: https://crates.io/crates/mnemo-core
    env:
      # Single source of truth for the publish walk (topological order: a
      # dependent never precedes a crate it needs). Used by BOTH the new-crate
      # preflight and the real publish loop below, so they can never disagree
      # about what the walk contains.
      WALK: "mnemo-core mnemo-graph mnemo-attention-state mnemo-compliance mnemo-mcp mnemo-postgres mnemo-rest mnemo-grpc mnemo-amp mnemo-db mnemo-embeddings-bench mnemo-mcp-server"
    steps:
      # fetch-depth: 0 so the registry-parity preflight can report a real
      # "newest git tag" column (the default shallow checkout fetches no tags).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # mnemo-grpc's prost build script needs protoc during its verify-build.
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # --- Token preflight (fail fast, fail loud) ---------------------------
      # THE reason v0.5.17 / v0.5.18 / v0.5.20 all tagged but never reached
      # crates.io: an EXPIRED CARGO_REGISTRY_TOKEN. Every one of those walks
      # packaged + verify-built mnemo-core (~5 min) and then died on the upload
      # with "403 Forbidden: authentication failed", after burning 5 retry
      # attempts — because the earlier fixes (timeout, 5xx retry) assumed the
      # failure was transient. It is not: a bad token is an OPERATOR action, not
      # a bug to work around. So validate the token up front, before building
      # anything, and fail with an explicit, actionable message + run summary.
      - name: Preflight CARGO_REGISTRY_TOKEN (missing = fail; /api/v1/me = advisory)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          UA="mnemo-release-crate-workflow (https://github.com/sattyamjjain/mnemo)"
          fail() {
            echo "::error::$1"
            {
              echo "## ❌ Release aborted — crates.io token problem"
              echo
              echo "$1"
              echo
              echo "**Operator action required** (no code change fixes this):"
              echo "1. Generate a new token at <https://crates.io/settings/tokens> — scopes **publish-new** + **publish-update**, a long/no expiry."
              echo "2. Update the repo secret \`CARGO_REGISTRY_TOKEN\` (Settings → Secrets and variables → Actions)."
              echo "3. Re-run this workflow (or push the tag again)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            fail "CARGO_REGISTRY_TOKEN is MISSING (the repo secret is empty)."
          fi
          # /api/v1/me returns 200 for a CLASSIC full-access token. A GRANULAR
          # (scoped) publish token has no account-read scope and returns 403 here
          # even though it can `cargo publish` perfectly well — the 0.5.22 libraries
          # were published on 2026-08-08 by exactly such a token (via
          # cargo-publish.yml, which has no /me check). So a non-200 is NOT a
          # reliable "token is dead" signal: hard-failing on it false-blocked this
          # very walk. Hard-fail only on a MISSING secret (above); treat /me as
          # ADVISORY otherwise and let the real publish be the authority — a
          # genuinely expired/unauthorized token fails at the first actual upload
          # with a specific auth error (and a new crate additionally needs
          # publish-new), which the walk already reports.
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" \
            -H "Authorization: ${CARGO_REGISTRY_TOKEN}" \
            https://crates.io/api/v1/me || echo 000)
          if [ "$code" = "200" ]; then
            echo "crates.io token accepted (whoami -> 200; full-access). Proceeding to publish."
          else
            echo "::warning::CARGO_REGISTRY_TOKEN did not pass /api/v1/me (HTTP ${code}). This is EXPECTED for a granular/scoped publish token (no account-read scope) and does NOT mean it cannot publish — the 0.5.22 libraries shipped 2026-08-08 with such a token. Proceeding; the real publish below is the authority."
            {
              echo "## ⚠️ Token did not pass /api/v1/me (HTTP ${code}) — proceeding anyway"
              echo
              echo "A granular/scoped crates.io token returns 403 on \`/api/v1/me\` (no account-read scope) yet still publishes; the 0.5.22 libraries shipped 2026-08-08 with such a token. A non-200 here is advisory, not fatal — the real publish below is the authority. A genuinely expired/unauthorized token fails at the first actual upload with a specific error (and a new crate additionally needs the \`publish-new\` scope; see the new-crate preflight)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # --- New-crate preflight (publish-new scope) --------------------------
      # The token /me check above proves the token AUTHENTICATES, not that it is
      # authorized to CREATE a crate. crates.io tokens are scoped: publish-update
      # updates an existing crate, but publish-new is ALSO required to publish a
      # crate that does not exist yet. That distinction is exactly what stranded
      # this line — the 0.5.22 libraries (all pre-existing) updated fine via
      # cargo-publish.yml, but `mnemo-embeddings-bench` is a NEW crate: if the
      # token lacks publish-new, the walk builds for ~30 min and then dies
      # creating it, and mnemo-mcp-server (which depends on it) never publishes
      # either. crates.io exposes no API to introspect a token's scopes, so this
      # cannot hard-verify; it surfaces every new crate UP FRONT so the operator
      # confirms the token has publish-new before the walk burns half an hour.
      # This is a HARD, EARLY gate (WI1). crates.io exposes no API to introspect a
      # token's scopes, so we cannot machine-verify publish-new. What we CAN do is
      # refuse to burn a ~30-min build and then die creating the first new crate:
      # if the walk contains a new crate, this step FAILS NOW unless the operator
      # has explicitly confirmed the token carries publish-new — either by checking
      # the `confirm_publish_new` box on a manual run, or by setting the repo
      # variable `RELEASE_TOKEN_HAS_PUBLISH_NEW=true` (Settings → Secrets and
      # variables → Actions → Variables) for tag-triggered runs. That confirmation
      # is a deliberate human ack that the exact stranding of mnemo-mcp-server
      # (blocked behind the never-created mnemo-embeddings-bench) cannot recur
      # silently. No new crates -> publish-update suffices and this step passes.
      - name: Gate — new crates require confirmed publish-new scope (fail early)
        env:
          CONFIRM: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_publish_new) && 'true' || vars.RELEASE_TOKEN_HAS_PUBLISH_NEW }}
        run: |
          set -euo pipefail
          UA="mnemo-release-crate-workflow (https://github.com/sattyamjjain/mnemo)"
          ver=$(grep -E '^version\s*=' Cargo.toml | head -1 | cut -d'"' -f2)
          new_crates=""
          for crate in $WALK; do
            # NEW = crates.io has no record of the crate at all (404 on the crate
            # root, not the version). Retry transient non-200/404 answers.
            code=""
            for a in 1 2 3; do
              code=$(curl -s -A "$UA" -o /dev/null -w "%{http_code}" \
                "https://crates.io/api/v1/crates/${crate}" || echo 000)
              case "$code" in 200|404) break ;; esac
              sleep $((a * 3))
            done
            [ "$code" = "404" ] && new_crates="${new_crates} ${crate}"
          done
          new_crates="${new_crates# }"

          if [ -z "$new_crates" ]; then
            echo "No new crates in this walk — every crate already exists on crates.io, so publish-update suffices. Gate passes."
            exit 0
          fi

          if [ "${CONFIRM:-}" = "true" ]; then
            echo "::warning::This walk will CREATE new crate(s) [${new_crates}] at ${ver}; publish-new confirmed by the operator. Proceeding."
            {
              echo "## ⚠️ New crates in this walk — publish-new confirmed"
              echo
              echo "Will CREATE (not update): \`${new_crates}\` — the operator has confirmed \`CARGO_REGISTRY_TOKEN\` carries \`publish-new\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Not confirmed + new crate in the walk => stop NOW, before the build.
          echo "::error::Release aborted BEFORE building: this walk must CREATE new crate(s) [${new_crates}] at ${ver}, which requires CARGO_REGISTRY_TOKEN to carry the publish-new scope, and that has not been confirmed. Confirm it to proceed (details below). This gate exists so mnemo-mcp-server can never again strand at 0.4.4 behind an uncreatable dependency."
          {
            echo "## ❌ Release aborted early — unconfirmed publish-new for new crate(s)"
            echo
            echo "This walk will **CREATE** (not update): \`${new_crates}\`."
            echo
            echo "Creating a crate on crates.io requires the token's **publish-new** scope (not just publish-update), and there is no API to verify a token's scopes ahead of time. So this release stops **before** the ~30-min build rather than dying mid-walk and stranding every crate after the new one (which is exactly how \`mnemo-mcp-server\` stuck at 0.4.4 behind the never-created \`mnemo-embeddings-bench\`)."
            echo
            echo "**To proceed:**"
            echo "1. Confirm the token at <https://crates.io/settings/tokens> has **both** \`publish-new\` and \`publish-update\` (regenerate + update the \`CARGO_REGISTRY_TOKEN\` secret if not)."
            echo "2. Then EITHER re-run via **Run workflow** with **confirm_publish_new** checked, OR set repo variable **\`RELEASE_TOKEN_HAS_PUBLISH_NEW=true\`** (Settings → Secrets and variables → Actions → Variables) and push the tag again."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # --- Registry-parity PREFLIGHT (issue #140) ---------------------------
      # Before building or uploading anything, print the full triple
      # (workspace version, newest git tag, crates.io version) for EVERY
      # publishable crate, and refuse to proceed on a lag this walk does not
      # repair. The bug being fixed is not "the token is bad" — it is that the
      # walk could skip a crate and still report success, which is how
      # mnemo-mcp-server sat at 0.4.4 for 87 days while the libraries moved to
      # 0.5.22. Silence was the failure mode; this makes the state explicit
      # before the walk, and the `--mode assert` step below re-checks it after.
      #
      # --fail-on-minor-lag adds the SEVERITY FLOOR, and is passed here and
      # nowhere else. `--mode assert` (below) already hard-fails on any crate in
      # WALK that did not land, but it can say nothing about a crate in NO walk —
      # and that is the hole #140 actually came through: mnemo-embeddings-bench
      # was absent from every walk, mnemo-mcp-server was stranded behind it, and
      # the pipeline emitted a warning on each run for 87 days.
      #
      # With the floor on, an out-of-walk crate that is a whole minor behind (or
      # absent from crates.io entirely) fails this release instead of warning.
      # Note the threshold is ANY minor-level lag, not "more than one minor":
      # #140 was 0.4.4 against a 0.5.22 workspace, exactly one minor, so a `> 1`
      # gate would have missed the very incident it was written for.
      #
      # This flag is deliberately NOT set in cargo-publish.yml. That workflow is
      # the push-to-main LIBRARY path and cannot publish mnemo-mcp-server by
      # design; failing it over a crate only this tag path can ship would block
      # good library releases on a repair it is incapable of making. WALK here
      # covers every publishable crate, so the floor can only ever fire on a
      # crate genuinely nothing will publish.
      - name: Registry parity preflight (print the triple, fail on an unrepaired lag)
        run: bash scripts/registry_parity.sh --mode preflight --walk "$WALK" --fail-on-minor-lag

      # --- Dry-run first (task step 4) --------------------------------------
      # A PER-CRATE dry-run cannot resolve the not-yet-published internal deps
      # (mnemo-core@<ver> is not on the registry until the real publish below), so
      # the dependents' packaging step fails with "no matching package". Instead
      # dry-run the whole set in ONE coordinated invocation: cargo computes the
      # publish order and satisfies inter-member deps from the local workspace,
      # packaging AND verify-building all four before any upload.
      - name: Dry-run (coordinated packaging + verify)
        run: |
          cargo publish --dry-run \
            -p mnemo-core -p mnemo-graph -p mnemo-attention-state \
            -p mnemo-compliance -p mnemo-mcp \
            -p mnemo-postgres -p mnemo-rest -p mnemo-grpc -p mnemo-amp -p mnemo-db \
            -p mnemo-embeddings-bench -p mnemo-mcp-server

      # --- Real publish, dependency order -----------------------------------
      - name: Publish (dependency order, idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: |
          set -euo pipefail
          ver=$(grep -E '^version\s*=' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "workspace version: ${ver}"
          # crates.io's API rejects requests without a User-Agent (403).
          UA="mnemo-release-crate-workflow (https://github.com/sattyamjjain/mnemo)"

          # crates.io presence check, tolerant of transient registry hiccups.
          # Returns the crate@ver HTTP code on stdout; retries a few times when
          # the registry answers 000 (network) or 5xx (Heroku "Application
          # Error", which reddened v0.5.20's first upload) so a blip on the GET
          # alone never fails the release. 200 = present, 404 = absent.
          crate_status() {
            local crate="$1" code=""
            for a in 1 2 3 4 5; do
              code=$(curl -s -A "$UA" -o /dev/null -w "%{http_code}" \
                "https://crates.io/api/v1/crates/${crate}/${ver}" || echo 000)
              case "$code" in
                200|404) echo "$code"; return 0 ;;
              esac
              sleep $((a * 5))
            done
            echo "$code"
          }

          # Topological order — a dependent never precedes a crate it needs, or
          # its verify-build cannot resolve that dep live from the sparse index.
          # mnemo-embeddings-bench needs only mnemo-core; mnemo-mcp-server (the
          # `mnemo` binary) needs core/mcp/rest/compliance/postgres and
          # embeddings-bench, so it publishes LAST. When the workspace version is
          # unchanged, crates already on crates.io 404-gate as present and only
          # new ones publish, so re-running the tag after this change publishes
          # only the two crates added here.
          crates="$WALK"  # single source of truth: the WALK job env above

          # Outcome ledger (WI1.3). A partial publish that reports success is the
          # failure mode that produced today's stranded state, so record every
          # crate as published-now / already-present / NOT-published and print
          # the ledger on EVERY exit — success OR failure — to the log and the
          # job summary. The walk is resumable: re-running skips crates already
          # at ${ver} (404-gate), so a failure mid-walk loses no completed work.
          published=(); present=()
          summarize() {
            local done_set=" ${published[*]:-} ${present[*]:-} "
            local nd=()
            for c in $crates; do
              case "$done_set" in *" $c "*) ;; *) nd+=("$c") ;; esac
            done
            echo "──────── publish ledger (${ver}) ────────"
            echo "  published now  : ${published[*]:-none}"
            echo "  already present: ${present[*]:-none}"
            echo "  NOT published  : ${nd[*]:-none}"
            {
              echo "### Publish ledger — ${ver}"
              echo "- **published now:** ${published[*]:-none}"
              echo "- **already present:** ${present[*]:-none}"
              echo "- **NOT published:** ${nd[*]:-none}"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }
          trap summarize EXIT

          for crate in $crates; do
            http=$(crate_status "$crate")
            if [ "$http" = "200" ]; then
              echo "  ${crate}@${ver} — already on crates.io, skipping"
              present+=("$crate"); continue
            elif [ "$http" != "404" ]; then
              echo "::error::${crate}@${ver} — crates.io still answering HTTP ${http} after retries; failing (later crates NOT published)"
              exit 1
            fi
            if [ -n "$DRY_RUN" ]; then
              echo "::group::dry-run publish ${crate} (workflow_dispatch dry_run)"
              cargo publish -p "${crate}" --dry-run --no-verify
              echo "::endgroup::"
              published+=("$crate"); continue
            fi
            # Publish with backoff — crates.io returns transient 5xx/timeouts on
            # upload independent of the payload (a 503 killed the first v0.5.20
            # run mid-upload). Between attempts, re-check presence: if a prior
            # attempt's upload actually landed despite a failed HTTP response, we
            # detect the 200 and stop rather than re-uploading (which errors).
            echo "::group::Publish ${crate}@${ver}"
            ok=""
            for attempt in 1 2 3 4 5; do
              if out=$(cargo publish -p "${crate}" 2>&1); then
                echo "$out"; ok=1; break
              fi
              echo "$out"
              # Landed anyway? (upload succeeded, HTTP response failed.)
              if [ "$(crate_status "$crate")" = "200" ]; then
                echo "  ${crate}@${ver} — landed despite a failed response; continuing"
                ok=1; break
              fi
              # An auth failure is NOT transient — the preflight passed, so the
              # token was revoked/expired mid-run. Do not burn 4 more attempts.
              if echo "$out" | grep -qiE 'authentication failed|403 Forbidden|401 Unauthorized'; then
                echo "::endgroup::"
                echo "::error::${crate}@${ver} — crates.io rejected the token mid-walk on ${crate} (auth/permission failure). If ${crate} is a NEW crate (see the new-crate preflight above) this is usually a missing publish-new scope, NOT an expired token; otherwise the token is expired/revoked. Fix CARGO_REGISTRY_TOKEN so it carries BOTH publish-new and publish-update, then re-run; crates already published are skipped on resume."
                exit 1
              fi
              if [ "$attempt" -lt 5 ]; then
                back=$((attempt * 30))
                echo "  publish attempt ${attempt} failed (transient); retrying in ${back}s"
                sleep "$back"
              fi
            done
            echo "::endgroup::"
            if [ -z "$ok" ]; then
              echo "::error::${crate}@${ver} — publish failed after 5 attempts (transient errors persisted); re-run to resume (published crates are skipped)."
              exit 1
            fi
            published+=("$crate")
            # Let the sparse index propagate before publishing a crate that
            # depends on the one just uploaded (verify build resolves it live).
            # Wait after every crate except the terminal leaf mnemo-db — cheap
            # insurance, since core/graph/attention-state/compliance/mcp each have
            # a later dependent in this list.
            if [ "${crate}" != "mnemo-db" ]; then
              echo "Waiting 60s for crates.io index propagation"
              sleep 60
            fi
          done

      # --- Post-publish release-parity gate --------------------------------
      # A publish that REPORTS success but leaves a member behind is the exact
      # silent failure that stranded mnemo-mcp-server at 0.4.4 for multiple
      # releases while the libraries moved on. After the walk, assert every
      # closure crate actually reached the workspace version on crates.io and
      # fail the release loudly if any lags. `always()` so a partial publish is
      # reported even when an earlier crate errored; skipped on a dry-run, where
      # nothing is uploaded so a lag is expected.
      - name: Assert release parity (every closure crate at the workspace version)
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: bash scripts/registry_parity.sh --mode assert $WALK
