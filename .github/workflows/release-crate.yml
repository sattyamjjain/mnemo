name: release-crate

# Publish the 0.5.x **library line** to crates.io on a `v*.*.*` tag.
#
# Scope — the importable set a user needs to run auditable memory AND the
# Postgres/REST/gRPC backends the README documents, published in dependency
# order:
#
#     mnemo-core → mnemo-graph → mnemo-attention-state → mnemo-compliance →
#     mnemo-mcp → mnemo-postgres → mnemo-rest → mnemo-grpc → (leaf) mnemo-db
#
# The four backend crates (graph, postgres, rest, grpc) were added here after
# they stranded at 0.4.4/0.4.5: this tag-gated path was originally the
# compliance line only, so `cargo add mnemo-postgres` kept resolving a
# 2-month-old version with none of the v0.5.7 (#99) real pgvector ANN or v0.5.18
# async VectorIndex work. Keeping them in THIS workflow (not just
# cargo-publish.yml, whose workspace-wide build the golem-wit WASM link failure
# reddens) means a tag ships the whole line — PROVIDED the registry token is
# valid.
#
# STATUS (as of 2026-08-02): still not shipped. v0.5.17 / v0.5.18 / v0.5.20 were
# all tagged and NONE reached crates.io; every walk died uploading mnemo-core
# with "403 Forbidden: authentication failed" — an EXPIRED CARGO_REGISTRY_TOKEN
# (last rotated 2026-04-25, ~90-day expiry ≈ 2026-07-24; v0.5.16 published
# 2026-07-24 was the last that beat it). The timeout / 5xx-retry commits treated
# it as transient; it is not. The token preflight below now fails fast and loud
# with the operator action, instead of burning ~10 min to rediscover the 403.
# This ships the moment the operator rotates the token.
#
# `mnemo-attention-state` is in the set because `mnemo-mcp` hard-depends on it
# (server.rs uses `mnemo_attention_state::AttentionStateStore`); it was
# introduced after the last 0.4.4 crates.io publish, so it must be published for
# `mnemo-mcp` to resolve.
#
# Plus a fifth leaf crate, `mnemo-db` — a dependency-free name-reservation
# pointer that redirects Rust users to mnemo-core/mnemo-mcp (the unqualified
# `mnemo` name on crates.io is an unrelated project). It has no internal deps, so
# it publishes independently; on an unchanged workspace version the four crates
# above 404-gate as already-present and only mnemo-db is newly published.
#
# Why a separate, tag-gated workflow (vs. cargo-publish.yml's push-to-main run):
#   - It gates on ONLY the publish closure, so the pre-existing golem-wit WASM
#     link failure (which reddens the workspace-wide build in cargo-publish.yml)
#     cannot block a release of these four crates.
#   - It publishes in the CORRECT dependency order (core before its dependents;
#     compliance before mcp) — cargo-publish.yml lists mcp before compliance.
#   - A tag is an explicit, intentional release trigger; a docs push is not.
#
# Prerequisites
#   - CARGO_REGISTRY_TOKEN repo secret (already configured for cargo-publish.yml).
#   - Every internal path dep in the root Cargo.toml carries `version` alongside
#     `path` (required for `cargo publish` to accept it).
#
# Idempotency: crates.io publishes are PERMANENT. Each crate publishes only if
# its version is not already on crates.io (404 check), so re-running a tag is a
# safe no-op for crates already up.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (package + verify, no upload)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate (fmt + clippy + tests, publish closure)
    if: github.repository == 'sattyamjjain/mnemo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `mnemo-grpc` (in the publish closure since v0.5.20) has a prost build
      # script that shells out to `protoc`; without it clippy/test fail before
      # any publish.
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Format is a whole-repo invariant and cheap.
      - run: cargo fmt --all -- --check
      # Clippy + tests are scoped to the crates being published (and their
      # transitive deps, pulled automatically) so an unrelated, pre-existing
      # WASM/golem link failure elsewhere in the workspace can never gate a
      # release of this compliance line. `-D warnings` matches CI.
      - name: Clippy (publish closure)
        run: |
          cargo clippy --all-targets \
            -p mnemo-core -p mnemo-graph -p mnemo-attention-state \
            -p mnemo-compliance -p mnemo-mcp \
            -p mnemo-postgres -p mnemo-rest -p mnemo-grpc -p mnemo-db \
            -p mnemo-embeddings-bench -p mnemo-mcp-server -- -D warnings
      # Full closure test suite. The recall-QUALITY benchmark
      # `domain_scoped_dilution` was made platform-robust (its "flat P@10 should
      # degrade" assertion now accepts the floor case where the approximate HNSW
      # surfaces no gold in top-k on some platforms — e.g. flat P@10 = 0 at every
      # corpus size on Linux; the headline "scoped beats flat by >= 0.05" claim is
      # still asserted), so the gate runs the whole suite with no skips.
      - name: Test (publish closure)
        run: |
          cargo test \
            -p mnemo-core -p mnemo-graph -p mnemo-attention-state \
            -p mnemo-compliance -p mnemo-mcp \
            -p mnemo-postgres -p mnemo-rest -p mnemo-grpc -p mnemo-db \
            -p mnemo-embeddings-bench -p mnemo-mcp-server

  publish:
    name: Publish to crates.io
    needs: gate
    if: github.repository == 'sattyamjjain/mnemo'
    runs-on: ubuntu-latest
    # The v0.5.20 closure grew from the 5-crate compliance line to 9 crates, each
    # verify-built TWICE (coordinated dry-run + real publish) plus 60s crates.io
    # index-propagation waits between dependency tiers. 45 min timed out on the
    # dry-run alone; give the full walk generous headroom.
    timeout-minutes: 180
    environment:
      name: crates-io
      url: https://crates.io/crates/mnemo-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # mnemo-grpc's prost build script needs protoc during its verify-build.
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # --- Token preflight (fail fast, fail loud) ---------------------------
      # THE reason v0.5.17 / v0.5.18 / v0.5.20 all tagged but never reached
      # crates.io: an EXPIRED CARGO_REGISTRY_TOKEN. Every one of those walks
      # packaged + verify-built mnemo-core (~5 min) and then died on the upload
      # with "403 Forbidden: authentication failed", after burning 5 retry
      # attempts — because the earlier fixes (timeout, 5xx retry) assumed the
      # failure was transient. It is not: a bad token is an OPERATOR action, not
      # a bug to work around. So validate the token up front, before building
      # anything, and fail with an explicit, actionable message + run summary.
      - name: Verify CARGO_REGISTRY_TOKEN is present and accepted by crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          UA="mnemo-release-crate-workflow (https://github.com/sattyamjjain/mnemo)"
          fail() {
            echo "::error::$1"
            {
              echo "## ❌ Release aborted — crates.io token problem"
              echo
              echo "$1"
              echo
              echo "**Operator action required** (no code change fixes this):"
              echo "1. Generate a new token at <https://crates.io/settings/tokens> — scopes **publish-new** + **publish-update**, a long/no expiry."
              echo "2. Update the repo secret \`CARGO_REGISTRY_TOKEN\` (Settings → Secrets and variables → Actions)."
              echo "3. Re-run this workflow (or push the tag again)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            fail "CARGO_REGISTRY_TOKEN is MISSING (the repo secret is empty)."
          fi
          # Validate WITHOUT publishing: crates.io GET /api/v1/me returns 200 for
          # a valid token and 403 for a missing/expired/revoked one.
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" \
            -H "Authorization: ${CARGO_REGISTRY_TOKEN}" \
            https://crates.io/api/v1/me || echo 000)
          if [ "$code" != "200" ]; then
            fail "CARGO_REGISTRY_TOKEN is present but crates.io rejected it (HTTP ${code} from /api/v1/me; 403 = expired or revoked). This is the exact failure that stranded v0.5.17 / v0.5.18 / v0.5.20 mid-upload."
          fi
          echo "crates.io token accepted (whoami → 200). Proceeding to publish."

      # --- Dry-run first (task step 4) --------------------------------------
      # A PER-CRATE dry-run cannot resolve the not-yet-published internal deps
      # (mnemo-core@<ver> is not on the registry until the real publish below), so
      # the dependents' packaging step fails with "no matching package". Instead
      # dry-run the whole set in ONE coordinated invocation: cargo computes the
      # publish order and satisfies inter-member deps from the local workspace,
      # packaging AND verify-building all four before any upload.
      - name: Dry-run (coordinated packaging + verify)
        run: |
          cargo publish --dry-run \
            -p mnemo-core -p mnemo-graph -p mnemo-attention-state \
            -p mnemo-compliance -p mnemo-mcp \
            -p mnemo-postgres -p mnemo-rest -p mnemo-grpc -p mnemo-db \
            -p mnemo-embeddings-bench -p mnemo-mcp-server

      # --- Real publish, dependency order -----------------------------------
      - name: Publish (dependency order, idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: |
          set -euo pipefail
          ver=$(grep -E '^version\s*=' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "workspace version: ${ver}"
          # crates.io's API rejects requests without a User-Agent (403).
          UA="mnemo-release-crate-workflow (https://github.com/sattyamjjain/mnemo)"

          # crates.io presence check, tolerant of transient registry hiccups.
          # Returns the crate@ver HTTP code on stdout; retries a few times when
          # the registry answers 000 (network) or 5xx (Heroku "Application
          # Error", which reddened v0.5.20's first upload) so a blip on the GET
          # alone never fails the release. 200 = present, 404 = absent.
          crate_status() {
            local crate="$1" code=""
            for a in 1 2 3 4 5; do
              code=$(curl -s -A "$UA" -o /dev/null -w "%{http_code}" \
                "https://crates.io/api/v1/crates/${crate}/${ver}" || echo 000)
              case "$code" in
                200|404) echo "$code"; return 0 ;;
              esac
              sleep $((a * 5))
            done
            echo "$code"
          }

          # Topological order — a dependent never precedes a crate it needs, or
          # its verify-build cannot resolve that dep live from the sparse index.
          # mnemo-embeddings-bench needs only mnemo-core; mnemo-mcp-server (the
          # `mnemo` binary) needs core/mcp/rest/compliance/postgres and
          # embeddings-bench, so it publishes LAST. When the workspace version is
          # unchanged, crates already on crates.io 404-gate as present and only
          # new ones publish, so re-running the tag after this change publishes
          # only the two crates added here.
          crates="mnemo-core mnemo-graph mnemo-attention-state mnemo-compliance mnemo-mcp mnemo-postgres mnemo-rest mnemo-grpc mnemo-db mnemo-embeddings-bench mnemo-mcp-server"

          # Outcome ledger (WI1.3). A partial publish that reports success is the
          # failure mode that produced today's stranded state, so record every
          # crate as published-now / already-present / NOT-published and print
          # the ledger on EVERY exit — success OR failure — to the log and the
          # job summary. The walk is resumable: re-running skips crates already
          # at ${ver} (404-gate), so a failure mid-walk loses no completed work.
          published=(); present=()
          summarize() {
            local done_set=" ${published[*]:-} ${present[*]:-} "
            local nd=()
            for c in $crates; do
              case "$done_set" in *" $c "*) ;; *) nd+=("$c") ;; esac
            done
            echo "──────── publish ledger (${ver}) ────────"
            echo "  published now  : ${published[*]:-none}"
            echo "  already present: ${present[*]:-none}"
            echo "  NOT published  : ${nd[*]:-none}"
            {
              echo "### Publish ledger — ${ver}"
              echo "- **published now:** ${published[*]:-none}"
              echo "- **already present:** ${present[*]:-none}"
              echo "- **NOT published:** ${nd[*]:-none}"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }
          trap summarize EXIT

          for crate in $crates; do
            http=$(crate_status "$crate")
            if [ "$http" = "200" ]; then
              echo "  ${crate}@${ver} — already on crates.io, skipping"
              present+=("$crate"); continue
            elif [ "$http" != "404" ]; then
              echo "::error::${crate}@${ver} — crates.io still answering HTTP ${http} after retries; failing (later crates NOT published)"
              exit 1
            fi
            if [ -n "$DRY_RUN" ]; then
              echo "::group::dry-run publish ${crate} (workflow_dispatch dry_run)"
              cargo publish -p "${crate}" --dry-run --no-verify
              echo "::endgroup::"
              published+=("$crate"); continue
            fi
            # Publish with backoff — crates.io returns transient 5xx/timeouts on
            # upload independent of the payload (a 503 killed the first v0.5.20
            # run mid-upload). Between attempts, re-check presence: if a prior
            # attempt's upload actually landed despite a failed HTTP response, we
            # detect the 200 and stop rather than re-uploading (which errors).
            echo "::group::Publish ${crate}@${ver}"
            ok=""
            for attempt in 1 2 3 4 5; do
              if out=$(cargo publish -p "${crate}" 2>&1); then
                echo "$out"; ok=1; break
              fi
              echo "$out"
              # Landed anyway? (upload succeeded, HTTP response failed.)
              if [ "$(crate_status "$crate")" = "200" ]; then
                echo "  ${crate}@${ver} — landed despite a failed response; continuing"
                ok=1; break
              fi
              # An auth failure is NOT transient — the preflight passed, so the
              # token was revoked/expired mid-run. Do not burn 4 more attempts.
              if echo "$out" | grep -qiE 'authentication failed|403 Forbidden|401 Unauthorized'; then
                echo "::endgroup::"
                echo "::error::${crate}@${ver} — crates.io rejected the token mid-walk (auth failure). Rotate CARGO_REGISTRY_TOKEN and re-run; crates already published are skipped on resume."
                exit 1
              fi
              if [ "$attempt" -lt 5 ]; then
                back=$((attempt * 30))
                echo "  publish attempt ${attempt} failed (transient); retrying in ${back}s"
                sleep "$back"
              fi
            done
            echo "::endgroup::"
            if [ -z "$ok" ]; then
              echo "::error::${crate}@${ver} — publish failed after 5 attempts (transient errors persisted); re-run to resume (published crates are skipped)."
              exit 1
            fi
            published+=("$crate")
            # Let the sparse index propagate before publishing a crate that
            # depends on the one just uploaded (verify build resolves it live).
            # Wait after every crate except the terminal leaf mnemo-db — cheap
            # insurance, since core/graph/attention-state/compliance/mcp each have
            # a later dependent in this list.
            if [ "${crate}" != "mnemo-db" ]; then
              echo "Waiting 60s for crates.io index propagation"
              sleep 60
            fi
          done
