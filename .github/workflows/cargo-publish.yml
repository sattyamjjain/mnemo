name: cargo-publish

# Auto-deploy to crates.io on push to main, gated by version-changed.
#
# Trigger model
#   - push to main: workflow runs, but each crate publishes ONLY if its
#     `version` (from workspace.package.version) doesn't already exist
#     on crates.io. A doc-only commit on main is a no-op.
#   - workflow_dispatch: manual trigger from the Actions UI for one-shot
#     republishes (e.g. retrying a rate-limited round).
#
# Why version-changed gating
#   crates.io publishes are PERMANENT — once a version is up, you can
#   only yank (which leaves the slot reserved). Without the version
#   check, every commit would attempt a republish and fail noisily.
#   With the check, the workflow is idempotent: re-running on the same
#   commit is safe.
#
# Release gate — a crates.io publish requires a matching git tag
#   crates.io is append-only, so every published version should be
#   bisectable back to a commit. The 0.5.22 line shipped from THIS
#   push-to-main path with no `v0.5.22` tag (release-crate.yml, the
#   tag-triggered path, never ran — which is also why the tag-only
#   crates mnemo-embeddings-bench + mnemo-mcp-server never published).
#   The plan job now refuses to publish a version that has no `v<ver>`
#   tag on the remote. It gates ONLY when something would actually
#   publish, so a doc-only push stays a clean no-op. Push the tag first:
#     git tag -a vX.Y.Z -m "mnemo vX.Y.Z" <commit> && git push origin vX.Y.Z
#
# Prerequisites
#   - CARGO_REGISTRY_TOKEN repo secret (set 2026-04-25; rotates per
#     normal token-rotation cadence).
#   - The workspace.dependencies block in Cargo.toml MUST carry
#     `version` alongside `path` for each internal crate. Already
#     present from PR #56.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no actual publish)"
        type: boolean
        default: false

jobs:
  plan:
    if: github.repository == 'sattyamjjain/mnemo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      to_publish: ${{ steps.diff.outputs.to_publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute which crates need publishing
        id: diff
        run: |
          set -euo pipefail
          # Workspace version — single source of truth for all 9 crates.
          ver=$(grep -E '^version\s*=' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "workspace version: ${ver}"
          to_publish=""
          # Order matters for the actual publish job — list in dep order.
          # crates.io's API rejects requests without a User-Agent
          # (returns 403 — see https://crates.io/data-access). Send
          # one explicitly. Without this, the precheck always sees 403
          # and silently skips every crate.
          UA="mnemo-publish-workflow (https://github.com/sattyamjjain/mnemo)"
          # TOPOLOGICAL publish order — a dependent must never appear before a
          # crate it depends on, or its verify-build cannot resolve that dep from
          # the registry (it is not yet uploaded). Verified against each crate's
          # [dependencies]:
          #   mnemo-core            (no internal deps)
          #   mnemo-graph           -> core
          #   mnemo-attention-state -> core        [was MISSING; mnemo-mcp needs it]
          #   mnemo-compliance      -> core        [was AFTER mcp/rest/grpc — wrong]
          #   mnemo-mcp             -> attention-state, compliance, core
          #   mnemo-postgres        -> core
          #   mnemo-rest            -> compliance, core
          #   mnemo-grpc            -> compliance, core
          #   mnemo-admin/pgwire/letta/mesh/codemode/deal/md-sync/cma/baseline -> core
          #   mnemo-db              (leaf name-reservation pointer, no deps)
          # mnemo-mcp-server is intentionally NOT here: it has a path-only dep on
          # the unpublished `mnemo-embeddings-bench` (bench/embeddings) with no
          # version, which `cargo publish` rejects. Publishing the CLI needs that
          # dep versioned+published (or made optional) first — tracked separately.
          for crate in mnemo-core mnemo-graph mnemo-attention-state \
                       mnemo-compliance mnemo-mcp mnemo-postgres \
                       mnemo-rest mnemo-grpc mnemo-admin mnemo-pgwire \
                       mnemo-letta mnemo-mesh mnemo-codemode mnemo-deal \
                       mnemo-md-sync mnemo-cma mnemo-baseline mnemo-db; do
            # 200 = already published; 404 = needs publishing.
            http=$(curl -s -A "$UA" -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/${crate}/${ver}")
            if [ "$http" = "404" ]; then
              echo "  ${crate}@${ver} — NOT YET PUBLISHED, queuing"
              to_publish="${to_publish} ${crate}"
            elif [ "$http" = "200" ]; then
              echo "  ${crate}@${ver} — already on crates.io, skipping"
            else
              # Anything other than 200/404 is unexpected (rate limit,
              # server error, or the User-Agent regression returning).
              # Fail loud rather than silently skipping.
              echo "  ${crate}@${ver} — unexpected HTTP ${http} from crates.io API; failing"
              exit 1
            fi
          done
          to_publish="${to_publish# }"

          # --- Release gate: no crates.io publish without a matching tag -------
          # A doc-only push has an empty queue and must stay a clean no-op, so
          # gate ONLY when something would actually publish. crates.io is
          # append-only: an untagged publish leaves a version nobody can bisect
          # to (this is how 0.5.22 shipped tagless). `git ls-remote` checks the
          # remote directly, so it works with the default shallow checkout.
          if [ -n "$to_publish" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v${ver}" >/dev/null 2>&1; then
              echo "release gate: tag v${ver} exists on the remote — publish allowed"
            else
              echo "::error::release gate: [${to_publish}] would publish ${ver} to crates.io, but no matching tag v${ver} exists. crates.io is permanent; an untagged publish is unbisectable (this is how 0.5.22 shipped tagless). Create and push the tag first, then re-run."
              {
                echo "## ❌ Release gate — missing tag for ${ver}"
                echo
                echo "Queued to publish: \`${to_publish}\` — but there is no \`v${ver}\` git tag on the remote."
                echo "crates.io publishes are permanent; an untagged publish cannot be bisected back to a commit."
                echo
                echo "**Fix:**"
                echo '```'
                echo "git tag -a v${ver} -m \"mnemo v${ver}\" <commit>"
                echo "git push origin v${ver}"
                echo '```'
                echo "Then re-run this workflow."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            # Sibling gate: CHANGELOG.md must carry a `## [${ver}]` heading, so
            # every published version is documented. 0.5.22 shipped with no
            # changelog section; this makes that impossible to skip again. The
            # heading is created by promoting the released `[Unreleased]` entries
            # into `## [${ver}] - <date>` before tagging.
            if grep -qE "^## \[${ver}\]" CHANGELOG.md; then
              echo "release gate: CHANGELOG.md has a '## [${ver}]' heading — publish allowed"
            else
              echo "::error::release gate: [${to_publish}] would publish ${ver}, but CHANGELOG.md has no '## [${ver}]' heading. Promote the released [Unreleased] entries into a '## [${ver}] - <date>' section and commit before releasing."
              {
                echo "## ❌ Release gate — missing CHANGELOG heading for ${ver}"
                echo
                echo "Queued to publish: \`${to_publish}\` at \`${ver}\`, but CHANGELOG.md has no \`## [${ver}]\` heading."
                echo "Every published version must have a changelog section."
                echo
                echo "**Fix:** promote the shipped \`[Unreleased]\` entries into \`## [${ver}] - <date>\`, commit, then re-run."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          echo "to_publish=${to_publish}" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.to_publish != ''
    runs-on: ubuntu-latest
    # 17 workspace crates × 12-min crates.io rate-limit spacing ≈ 204 min,
    # plus 30-60s of compile + upload per crate. The v0.4.2 publish hit
    # the prior 180-min cap (cancelled at 183 min, 10/17 crates done) and
    # required a manual workflow_dispatch resume. Pad to 300 so a fresh-
    # version run that has to walk every crate completes in one shot.
    timeout-minutes: 300
    environment:
      name: crates-io
      url: https://crates.io/crates/mnemo-core
    steps:
      # fetch-depth: 0 so the registry-parity preflight can report a real
      # "newest git tag" column. The default shallow checkout fetches no tags
      # and the triple printed `none`, which defeats the point of printing it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Verify workspace builds
        # Exclude the golem WASM-component crates: they are NOT published (not in
        # the crate list below), and their `wit-bindgen` cdylib link step fails on
        # the stock CI linker (rust-lld rejects the `:` in the generated
        # `cabi_post_mnemo:golem-vector/...` version-script symbol). That
        # pre-existing, unrelated failure must not gate publishing the real crates
        # — it is exactly what stranded mnemo-postgres/rest/grpc/graph at 0.4.4
        # while the rest of the workspace moved to 0.5.x. `cargo publish -p <crate>`
        # below only builds each crate's own closure, never the golem crates.
        run: cargo build --workspace --exclude mnemo-python --exclude mnemo-golem-wit --exclude mnemo-golem-host
      # --- Registry-parity PREFLIGHT (issue #140) ---------------------------
      # Same gate as release-crate.yml: print the triple (workspace version,
      # newest git tag, crates.io version) for every publishable crate BEFORE
      # uploading, and refuse to proceed on a lag this run does not repair.
      # `--walk` is the plan job's queue, so a crate that lags and is not queued
      # fails the run instead of being silently left behind.
      - name: Registry parity preflight (print the triple, fail on an unrepaired lag)
        env:
          QUEUED: ${{ needs.plan.outputs.to_publish }}
        run: bash scripts/registry_parity.sh --mode preflight --walk "$QUEUED"

      - name: Publish queued crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          QUEUED: ${{ needs.plan.outputs.to_publish }}
        run: |
          set -euo pipefail
          # Reorder QUEUED to honour dependency order — mnemo-core first,
          # then second-tier, then mnemo-mcp-server last. The plan job
          # already lists in this order so we trust QUEUED's order.
          #
          # Outcome ledger (issue #140). The failure this pipeline actually had
          # was not a crash — it was a walk that skipped a crate and still
          # reported green. Record every crate as published / NOT published and
          # print the ledger on EVERY exit, success or failure, so a partial
          # walk can never look like a complete one.
          published=(); notdone=()
          summarize() {
            local done_set=" ${published[*]:-} "
            notdone=()
            for c in $QUEUED; do
              case "$done_set" in *" $c "*) ;; *) notdone+=("$c") ;; esac
            done
            echo "──────── publish ledger ────────"
            echo "  published    : ${published[*]:-none}"
            echo "  NOT published: ${notdone[*]:-none}"
            {
              echo "### Publish ledger"
              echo "- **published:** ${published[*]:-none}"
              echo "- **NOT published:** ${notdone[*]:-none}"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }
          trap summarize EXIT

          for crate in $QUEUED; do
            echo "::group::Publish ${crate}"
            # Capture output so an auth failure can be identified specifically.
            # An expired/unscoped token is an OPERATOR action, not a transient
            # error, and must never be swallowed or retried into a green run —
            # that is precisely how the mnemo-mcp-server stranding went
            # unnoticed for 87 days.
            if ! out=$(cargo publish -p "${crate}" $DRY_RUN 2>&1); then
              echo "$out"
              echo "::endgroup::"
              if echo "$out" | grep -qiE 'authentication failed|403 Forbidden|401 Unauthorized|not authorized|token.*(expired|invalid)'; then
                echo "::error::${crate} — crates.io REJECTED THE TOKEN (auth/permission failure). This is an operator action, not a transient error: rotate CARGO_REGISTRY_TOKEN so it carries BOTH publish-new and publish-update, then re-run. See issue #140. Failing the job — an auth failure is never swallowed."
                {
                  echo "## ❌ Publish aborted — crates.io rejected the token"
                  echo
                  echo "Failed on \`${crate}\`. crates.io returned an authentication/permission error."
                  echo
                  echo "**Operator action required** (no code change fixes this):"
                  echo "1. Generate a token at <https://crates.io/settings/tokens> with **publish-new** + **publish-update**."
                  echo "2. Update the \`CARGO_REGISTRY_TOKEN\` repo secret."
                  echo "3. Re-run. Crates already published are skipped."
                  echo
                  echo "Tracking: [issue #140](https://github.com/sattyamjjain/mnemo/issues/140)."
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              else
                echo "::error::${crate} — cargo publish failed (non-auth). See the log above; later crates were NOT published."
              fi
              exit 1
            fi
            echo "$out"
            echo "::endgroup::"
            published+=("$crate")
            # crates.io has a free-account rate limit of ~5 new crates
            # per hour. After mnemo-core lands, sleep briefly to let
            # the index propagate before the next publish that depends
            # on it.
            if [ "${crate}" = "mnemo-core" ] && [ -z "$DRY_RUN" ]; then
              echo "Waiting 60s for crates.io index propagation"
              sleep 60
            fi
            # Stay under the 5/hour ceiling — 12 min between sequential
            # NEW-crate publishes after the burst.
            if [ -z "$DRY_RUN" ]; then sleep 720; fi
          done

      # --- Post-publish parity assertion (issue #140) -----------------------
      # The walk above can still end "successfully" having published a subset.
      # Assert the queued crates actually reached the workspace version.
      # `always()` so a partial publish is reported even when a crate errored.
      - name: Assert registry parity (queued crates reached the workspace version)
        if: ${{ always() && !inputs.dry_run }}
        env:
          QUEUED: ${{ needs.plan.outputs.to_publish }}
        run: bash scripts/registry_parity.sh --mode assert $QUEUED
