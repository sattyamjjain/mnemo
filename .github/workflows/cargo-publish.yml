name: cargo-publish

# Auto-deploy to crates.io on push to main, gated by version-changed.
#
# Trigger model
#   - push to main: workflow runs, but each crate publishes ONLY if its
#     `version` (from workspace.package.version) doesn't already exist
#     on crates.io. A doc-only commit on main is a no-op.
#   - workflow_dispatch: manual trigger from the Actions UI for one-shot
#     republishes (e.g. retrying a rate-limited round).
#
# Why version-changed gating
#   crates.io publishes are PERMANENT — once a version is up, you can
#   only yank (which leaves the slot reserved). Without the version
#   check, every commit would attempt a republish and fail noisily.
#   With the check, the workflow is idempotent: re-running on the same
#   commit is safe.
#
# Prerequisites
#   - CARGO_REGISTRY_TOKEN repo secret (set 2026-04-25; rotates per
#     normal token-rotation cadence).
#   - The workspace.dependencies block in Cargo.toml MUST carry
#     `version` alongside `path` for each internal crate. Already
#     present from PR #56.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no actual publish)"
        type: boolean
        default: false

jobs:
  plan:
    if: github.repository == 'sattyamjjain/mnemo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      to_publish: ${{ steps.diff.outputs.to_publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute which crates need publishing
        id: diff
        run: |
          set -euo pipefail
          # Workspace version — single source of truth for all 9 crates.
          ver=$(grep -E '^version\s*=' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "workspace version: ${ver}"
          to_publish=""
          # Order matters for the actual publish job — list in dep order.
          # crates.io's API rejects requests without a User-Agent
          # (returns 403 — see https://crates.io/data-access). Send
          # one explicitly. Without this, the precheck always sees 403
          # and silently skips every crate.
          UA="mnemo-publish-workflow (https://github.com/sattyamjjain/mnemo)"
          # TOPOLOGICAL publish order — a dependent must never appear before a
          # crate it depends on, or its verify-build cannot resolve that dep from
          # the registry (it is not yet uploaded). Verified against each crate's
          # [dependencies]:
          #   mnemo-core            (no internal deps)
          #   mnemo-graph           -> core
          #   mnemo-attention-state -> core        [was MISSING; mnemo-mcp needs it]
          #   mnemo-compliance      -> core        [was AFTER mcp/rest/grpc — wrong]
          #   mnemo-mcp             -> attention-state, compliance, core
          #   mnemo-postgres        -> core
          #   mnemo-rest            -> compliance, core
          #   mnemo-grpc            -> compliance, core
          #   mnemo-admin/pgwire/letta/mesh/codemode/deal/md-sync/cma/baseline -> core
          #   mnemo-db              (leaf name-reservation pointer, no deps)
          # mnemo-mcp-server is intentionally NOT here: it has a path-only dep on
          # the unpublished `mnemo-embeddings-bench` (bench/embeddings) with no
          # version, which `cargo publish` rejects. Publishing the CLI needs that
          # dep versioned+published (or made optional) first — tracked separately.
          for crate in mnemo-core mnemo-graph mnemo-attention-state \
                       mnemo-compliance mnemo-mcp mnemo-postgres \
                       mnemo-rest mnemo-grpc mnemo-admin mnemo-pgwire \
                       mnemo-letta mnemo-mesh mnemo-codemode mnemo-deal \
                       mnemo-md-sync mnemo-cma mnemo-baseline mnemo-db; do
            # 200 = already published; 404 = needs publishing.
            http=$(curl -s -A "$UA" -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/${crate}/${ver}")
            if [ "$http" = "404" ]; then
              echo "  ${crate}@${ver} — NOT YET PUBLISHED, queuing"
              to_publish="${to_publish} ${crate}"
            elif [ "$http" = "200" ]; then
              echo "  ${crate}@${ver} — already on crates.io, skipping"
            else
              # Anything other than 200/404 is unexpected (rate limit,
              # server error, or the User-Agent regression returning).
              # Fail loud rather than silently skipping.
              echo "  ${crate}@${ver} — unexpected HTTP ${http} from crates.io API; failing"
              exit 1
            fi
          done
          echo "to_publish=${to_publish# }" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.to_publish != ''
    runs-on: ubuntu-latest
    # 17 workspace crates × 12-min crates.io rate-limit spacing ≈ 204 min,
    # plus 30-60s of compile + upload per crate. The v0.4.2 publish hit
    # the prior 180-min cap (cancelled at 183 min, 10/17 crates done) and
    # required a manual workflow_dispatch resume. Pad to 300 so a fresh-
    # version run that has to walk every crate completes in one shot.
    timeout-minutes: 300
    environment:
      name: crates-io
      url: https://crates.io/crates/mnemo-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Verify workspace builds
        # Exclude the golem WASM-component crates: they are NOT published (not in
        # the crate list below), and their `wit-bindgen` cdylib link step fails on
        # the stock CI linker (rust-lld rejects the `:` in the generated
        # `cabi_post_mnemo:golem-vector/...` version-script symbol). That
        # pre-existing, unrelated failure must not gate publishing the real crates
        # — it is exactly what stranded mnemo-postgres/rest/grpc/graph at 0.4.4
        # while the rest of the workspace moved to 0.5.x. `cargo publish -p <crate>`
        # below only builds each crate's own closure, never the golem crates.
        run: cargo build --workspace --exclude mnemo-python --exclude mnemo-golem-wit --exclude mnemo-golem-host
      - name: Publish queued crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          QUEUED: ${{ needs.plan.outputs.to_publish }}
        run: |
          set -euo pipefail
          # Reorder QUEUED to honour dependency order — mnemo-core first,
          # then second-tier, then mnemo-mcp-server last. The plan job
          # already lists in this order so we trust QUEUED's order.
          for crate in $QUEUED; do
            echo "::group::Publish ${crate}"
            cargo publish -p "${crate}" $DRY_RUN
            echo "::endgroup::"
            # crates.io has a free-account rate limit of ~5 new crates
            # per hour. After mnemo-core lands, sleep briefly to let
            # the index propagate before the next publish that depends
            # on it.
            if [ "${crate}" = "mnemo-core" ] && [ -z "$DRY_RUN" ]; then
              echo "Waiting 60s for crates.io index propagation"
              sleep 60
            fi
            # Stay under the 5/hour ceiling — 12 min between sequential
            # NEW-crate publishes after the burst.
            if [ -z "$DRY_RUN" ]; then sleep 720; fi
          done
