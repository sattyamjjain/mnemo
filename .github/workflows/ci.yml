name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Registry state changes without anyone pushing. The published-versions table
  # and the Python SDK compatibility paragraph are generated from live PyPI,
  # npm and crates.io, so on a push-only trigger they are only as fresh as the
  # last commit: a publish that lands minutes after a merge leaves the README
  # stating a version that is already wrong, and nothing goes red until someone
  # happens to push. That is how the README sat claiming `mnemo-db 0.5.12`
  # while PyPI served 0.5.26.
  #
  # 07:17 rather than a round hour: every scheduled workflow on the platform
  # fires at :00, and this one is not urgent enough to join that queue.
  schedule:
    - cron: "17 7 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# Notes for maintainers:
# - `mnemo-python` is a PyO3 cdylib that must be built with `maturin`, not
#   `cargo`. Every workspace-wide cargo command excludes it.
# - `mnemo-grpc` needs `protoc`; we install it up front on every job that
#   compiles the workspace.
# - The `onnx` feature of `mnemo-core` builds and tests against the pinned
#   `ort 2.0.0-rc.11` / `ndarray 0.17` / `tokenizers 0.23` API (the migration
#   that repaired the old ndarray-0.16 drift from Dependabot PR #11; issue #125).
#   It is NOT enabled in the workspace-wide clippy/test jobs — not because it is
#   broken, but because `ort` is a heavy native dependency (it compiles ONNX
#   Runtime and downloads its prebuilt library) and would slow every job. It has
#   its own dedicated `onnx` job below (`cargo build`+`test -p mnemo-core
#   --features onnx`) so it can never silently rot again. Default features still
#   cover the entire production surface.
# - `mnemo-golem-wit` is a cdylib WASM component (the golem:vector WIT
#   provider); it is in `[workspace] exclude`, not `members`, because its
#   WASM-only host imports have no native definition and the native cdylib
#   link fails ("Undefined symbols … _cabi_post_mnemo:golem-vector/…"). That
#   is what reddened `cargo build --workspace` from 69a8ca6 (2026-05-21) until
#   it was excluded. Build it standalone (it carries its own `[workspace]`) with
#   `cargo component build --release --manifest-path
#   crates/mnemo-golem-wit/Cargo.toml --target wasm32-wasip2`.
jobs:
  fmt:
    name: Format
    # Skipped on the nightly schedule: the cron exists to re-check the
    # generated blocks against live registries, and recompiling the
    # workspace daily to do that would be a lot of CI for no signal.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    # Skipped on the nightly schedule: the cron exists to re-check the
    # generated blocks against live registries, and recompiling the
    # workspace daily to do that would be a lot of CI for no signal.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --all-targets --workspace --exclude mnemo-python

  test:
    name: Test
    # Skipped on the nightly schedule: the cron exists to re-check the
    # generated blocks against live registries, and recompiling the
    # workspace daily to do that would be a lot of CI for no signal.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --exclude mnemo-python 2>&1 | tee /tmp/workspace-tests.log

      # The concurrency reproduction runs inside the workspace test above. This
      # step asserts it actually RAN and PASSED there, so deleting the file or
      # marking a test `#[ignore]` is a CI failure rather than a silent
      # reduction in coverage: the workspace run stays green either way, and
      # "the check is gone" and "the check passes" look identical from a
      # summary line.
      #
      # It reads that run's output rather than invoking cargo a second time,
      # and that is not a stylistic choice. Any second invocation with a
      # different target filter gives `libduckdb-sys` a fresh fingerprint, and
      # rebuilding DuckDB from source does not fit beside the artifacts the
      # first build already wrote — the runner dies with
      # `ar: ... No space left on device`, which is how this step failed twice
      # before being written this way. Reading the real run is also strictly
      # better evidence than re-running: it is the run whose result the job
      # reports.
      - name: Concurrent hash-chain linkage (must run, not merely pass)
        run: |
          set -uo pipefail
          # libtest colours "ok" when CARGO_TERM_COLOR is set, so strip ANSI
          # before matching or every line looks like a failure.
          plain=$(sed -E 's/\x1b\[[0-9;]*m//g' /tmp/workspace-tests.log)
          missing=0
          for t in concurrent_remember_produces_one_event_chain \
                   concurrent_remember_produces_one_memory_chain \
                   concurrent_remember_chains_within_an_explicit_thread; do
            if printf '%s\n' "$plain" | grep -qE "^test ${t} \.\.\. ok$"; then
              echo "ran and passed: $t"
            else
              echo "::error::${t} did not run and pass in the workspace test run"
              missing=1
            fi
          done
          exit "$missing"

  # Dedicated job for the `onnx` feature. It builds and tests fine against the
  # pinned ort 2.0.0-rc.11 / ndarray 0.17 API, but `ort` compiles ONNX Runtime
  # and downloads a prebuilt native lib, so it is kept out of the workspace-wide
  # jobs (which stay default-features + fast) and exercised here instead. This is
  # the guard that stops the feature silently rotting again (issue #125). It does
  # NOT run end-to-end ONNX inference — that needs a real model on disk
  # (MNEMO_ONNX_MODEL_PATH), exercised by the out-of-tree benches — but it proves
  # the feature compiles, links the native runtime, and its test suite passes.
  onnx-feature:
    name: onnx feature (mnemo-core)
    # Skipped on the nightly schedule: the cron exists to re-check the
    # generated blocks against live registries, and recompiling the
    # workspace daily to do that would be a lot of CI for no signal.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p mnemo-core --features onnx
      # Fetch a real all-MiniLM-L6-v2 ONNX model (384-dim) so the end-to-end
      # inference test (issue #125) actually exercises tokenize -> ort inference
      # -> mean-pool -> L2-normalise, not just that the feature compiles. Without
      # a model the onnx unit tests only assert that construction errors; a
      # feature that builds but never demonstrably runs is the latent-stub class
      # of bug (cf. the Postgres semantic-recall stub fixed in v0.5.7). The test
      # is gated on MNEMO_ONNX_MODEL_PATH and skips (still green) when it is unset.
      - name: Download all-MiniLM-L6-v2 ONNX (for the end-to-end inference test)
        run: |
          mkdir -p "$RUNNER_TEMP/minilm"
          curl -sSL --retry 3 --retry-delay 5 --fail \
            -o "$RUNNER_TEMP/minilm/model.onnx" \
            https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
          curl -sSL --retry 3 --retry-delay 5 --fail \
            -o "$RUNNER_TEMP/minilm/tokenizer.json" \
            https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/tokenizer.json
      - name: Test onnx feature (real end-to-end inference)
        env:
          MNEMO_ONNX_MODEL_PATH: ${{ runner.temp }}/minilm/model.onnx
        run: cargo test -p mnemo-core --features onnx

  build:
    name: Build
    # Skipped on the nightly schedule: the cron exists to re-check the
    # generated blocks against live registries, and recompiling the
    # workspace daily to do that would be a lot of CI for no signal.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # mnemo-python is a PyO3 cdylib that won't link without the
      # Python development headers + maturin context. Built separately
      # via the pypi-publish workflow.
      - run: cargo build --workspace --exclude mnemo-python

  security:
    name: Security Audit
    # Skipped on the nightly schedule: the cron exists to re-check the
    # generated blocks against live registries, and recompiling the
    # workspace daily to do that would be a lot of CI for no signal.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  postgres:
    name: Postgres integration (pgvector ANN)
    # Skipped on the nightly schedule: the cron exists to re-check the
    # generated blocks against live registries, and recompiling the
    # workspace daily to do that would be a lot of CI for no signal.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Live pgvector database so the MNEMO_TEST_POSTGRES_URL-gated ANN test
    # (crates/mnemo-postgres/tests/pgvector_ann.rs) actually runs instead of
    # skipping — this is the #99 acceptance gate.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MNEMO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/mnemo_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mnemo-postgres --test pgvector_ann -- --nocapture
      # The PostgreSQL half of the concurrency fix. It uses a different
      # mechanism from DuckDB's — `pg_advisory_xact_lock` rather than an
      # in-process lock — so the mnemo-core test proves nothing about it, and
      # without a live database it skips. This job is the only place it runs.
      #
      # (Only the two named tests run in this job. `write_provenance_pg` and
      # `semantic_recall_fails_loud` are also MNEMO_TEST_POSTGRES_URL-gated and
      # are not wired in here; that gap predates this change and is not closed
      # by it.)
      - run: cargo test -p mnemo-postgres --test concurrent_chain_linkage_pg -- --nocapture

  # Fails when the workspace version drifts MORE THAN ONE PATCH ahead of the
  # newest mnemo-core release on crates.io — the forcing function that stops
  # tagged-but-unpublished releases from piling up (see scripts/check_version_drift.sh).
  version-drift:
    name: Version drift (crates.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_version_drift.sh

      # Offline. Asserts the severity-floor threshold in registry_parity.sh
      # against its documented table. That threshold only ever fires during a
      # broken release, so nothing else would exercise it — and the natural
      # wrong spelling ("fail on more than one minor") silently misses #140,
      # which was exactly ONE minor behind. This is what keeps it honest.
      - name: Registry-parity severity-floor self-test
        run: bash scripts/registry_parity.sh --self-test

  # Python test suite. Added 2026-08-15 — until then NOTHING ran pytest, so the
  # 138-test Python suite was unexecuted in CI and had been sitting on two
  # failures nobody could see: a version-alignment test red since 0.5.12, and a
  # real Tantivy LockBusy bug (two MnemoSessionStore on one db_path each opened
  # an IndexWriter). Both are fixed; this job is what stops them recurring.
  #
  # The native extension IS built rather than skipped. The integration tests
  # self-skip when `mnemo._mnemo` is missing, so a pure-Python job would go green
  # while silently not running the very tests that cover the session-store fix —
  # the same "skip is indistinguishable from a pass" failure mode that let
  # mnemo-mcp-server strand for 87 days.
  python-tests:
    name: Python tests (pytest)
    # Skipped on the nightly schedule: the cron exists to re-check the
    # generated blocks against live registries, and recompiling the
    # workspace daily to do that would be a lot of CI for no signal.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the native extension (maturin)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path python/Cargo.toml -i python3.12
      - name: Install the wheel + dev extras
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Install the built wheel, then the dev extras (pytest, moto, and the
          # GCS/Azure SDKs the #39 backend tests import-guard on).
          python -m pip install dist/*.whl
          python -m pip install "pytest>=7.0" "pytest-asyncio>=0.23" "moto>=5.0" \
                                "google-cloud-storage>=2.14" "azure-storage-blob>=12.19" \
                                "boto3>=1.34" "cryptography>=42"
      # The native extension is the ENTIRE reason this job builds a wheel instead
      # of running pure-Python. Sixteen tests — every @integration test in
      # test_openai_sessions.py, test_openai_sessions_ga.py and
      # test_write_provenance.py, including
      # `test_sessions_do_not_leak_across_session_ids`, the regression test for
      # the Tantivy LockBusy fix — are gated behind
      # `importlib.util.find_spec("mnemo._mnemo")` and SKIP when it is missing.
      # A skip is green, so a job that lets them skip passes while testing
      # nothing.
      #
      # RUN FROM THE REPOSITORY ROOT, NOT FROM python/. `python -m pytest`
      # prepends its working directory to sys.path. With cwd=python/, the
      # SOURCE package `python/mnemo/` shadows the wheel installed into
      # site-packages — and the source tree carries no compiled `_mnemo`
      # (locally it appears to, only because `maturin develop` copies the .so
      # into it; a wheel install does not). All sixteen therefore skipped on
      # 2026-08-15 while the job reported success.
      #
      # The guard runs in the SAME STEP as pytest, deliberately. As a separate
      # step it ran from the repo root while pytest ran from python/, so it
      # asserted against a different sys.path than the tests used and printed
      # "imports OK" over sixteen skips. Co-locating them is what makes the
      # assertion structurally honest; splitting them re-opens the bug.
      #
      # `-rs` prints the reason for every skip — without it the log is a bare
      # "N passed, M skipped" and a newly-silenced test is invisible in review.
      - name: pytest (with native-extension guard)
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, sys

          FAIL = (
              "mnemo._mnemo is NOT importable from the repository root — the "
              "wheel did not install the native extension, or something is "
              "shadowing it on sys.path. The native-gated tests would silently "
              "skip and this job would pass while testing nothing. Failing."
          )

          # find_spec RAISES ModuleNotFoundError when the PARENT package is
          # missing and only returns None when the parent exists but the
          # submodule does not — so both have to be handled or a totally absent
          # wheel exits with a bare traceback that explains nothing.
          try:
              found = importlib.util.find_spec("mnemo._mnemo") is not None
          except ModuleNotFoundError:
              found = False
          if not found:
              sys.exit(FAIL)

          import mnemo._mnemo  # prove it loads, not just that it resolves
          print(f"mnemo._mnemo imports OK from {mnemo._mnemo.__file__}")
          PY

          python -m pytest python/tests/ -q -rs --import-mode=importlib \
            | tee "$RUNNER_TEMP/pytest.log"

          # The import check above proves only what the GUARD can see. This
          # asserts what the TESTS actually did: if any test skipped because the
          # native extension was missing, the wheel is not reaching pytest and
          # the run is not covering the native path — regardless of the guard.
          #
          # Deliberately matches only the "native extension not built" reasons
          # (test_openai_sessions*.py, test_write_provenance.py). It does NOT
          # match test_claude_agent_sdk.py, which additionally needs
          # OPENAI_API_KEY and so skips here legitimately.
          if grep -q "native extension not built" "$RUNNER_TEMP/pytest.log"; then
            echo "::error::Tests skipped for a missing native extension:"
            grep "native extension not built" "$RUNNER_TEMP/pytest.log" >&2
            exit 1
          fi

  # OFFLINE workspace version fence — every crate's Cargo.toml, every internal
  # dependency pin, the newest git tag and the CHANGELOG must agree on ONE
  # version. Three numbers coexisted before this existed (workspace 0.5.23,
  # mnemo-golem-wit 0.5.21, newest tag v0.5.22).
  #
  # This runs as its own job ONLY because it needs `fetch-depth: 0`: the default
  # shallow checkout fetches no tags, and the fence's tag legs skip themselves
  # rather than fail when no tags are reachable (a fence that fails because the
  # checkout has no tags is testing the checkout, not the repo). The plain `test`
  # job also runs these tests — it just cannot exercise the tag legs.
  version-fence:
    name: Workspace version fence (offline)
    # Skipped on the nightly schedule: the cron exists to re-check the
    # generated blocks against live registries, and recompiling the
    # workspace daily to do that would be a lot of CI for no signal.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mnemo-mcp-server --test workspace_version_fence

  # Offline documentation guards. Deliberately NOT in docs.yml: that workflow is
  # path-filtered to docs/** and only runs when documentation changes, but both
  # guards below protect against text reappearing *anywhere*, including in a PR
  # that touches no doc path directly.
  doc-guards:
    name: Doc guards (crate names, publish closure, GPM table, published versions, recall number)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two crates.io names collide with this project and belong to other
      # people: `mnemo` (aayushadhikari7/mnemo) and `mnemo-cli` (watzon/mnemo).
      # This project publishes only under `mnemo-*`, and the server binary
      # publishes as `mnemo-mcp-server` even though its crate directory is
      # `crates/mnemo-cli` — which is what makes `cargo install mnemo-cli` such
      # an easy line to write. It resolves, it installs someone else's program,
      # and without this gate nothing anywhere goes red.
      #
      # This was verified by hand once (CHANGELOG, 2026-08-12) and then had no
      # way to stay verified. The self-test runs first so a matcher that can no
      # longer fire fails loudly instead of passing as clean coverage.
      - name: Crate-name reference guard self-test
        run: bash scripts/check_crate_name_refs.sh --self-test
      - name: Crate-name reference guard
        run: bash scripts/check_crate_name_refs.sh

      # The publish closure must cover every crate that is supposed to ship.
      # Two releases died because the list of crates to publish was written
      # down more than once and the copies drifted (v0.5.24, v0.5.25), and a
      # third variant went unnoticed entirely: seven crates published only on
      # the push-to-main lane, that lane stopped partway through v0.5.25, and
      # they sat a patch behind with nothing red. This asserts the general form
      # — a crate that should ship is in the list that ships crates — so a new
      # crate cannot be orphaned by being forgotten.
      #
      # Self-test first, same reasoning as above: a guard that can no longer
      # fail must not pass as coverage. One of its fixtures reproduces the exact
      # v0.5.24 regression.
      - name: Publish-closure guard self-test
        run: bash scripts/check_publish_closure.sh --self-test
      - name: Publish closure covers every publishable crate
        run: bash scripts/check_publish_closure.sh

      # v0.5.23/24/25 all shipped with no GitHub Release object because nothing
      # ever created one. `release-crate.yml` now does, from the CHANGELOG
      # section for the tag. This is the parsing half, tested separately so a
      # release cannot ship an empty body or silently pick up `[Unreleased]`.
      - name: Release-notes extractor self-test
        run: python3 scripts/extract_release_notes.py --self-test

      # The GPM gap table is generated from
      # docs/research/governed-persistent-memory-clauses.toml. This fails if the
      # committed markdown has drifted from the manifest. The *content* of the
      # manifest — that a shipped clause points at a real symbol and an absent
      # one points at nothing — is asserted separately by
      # `cargo test -p mnemo-compliance --test gpm_clause_manifest` in the main
      # test job.
      - name: GPM clause table is generated, not hand-edited
        run: python3 scripts/gen_gpm_clause_table.py --check

      # The README's published-versions table is the only place a reader can see
      # WHICH crates are installable at WHICH version, and the 0.5.24 release
      # proved it can split: 19 library crates landed while `mnemo-mcp-server`
      # and `mnemo-embeddings-bench` stayed a release behind, because the tag
      # lane's dry-run could not resolve `mnemo-admin = "^0.5.24"`. The table had
      # been stale since 2026-08-14 and nothing caught it, since `--check`
      # existed but ran nowhere. It runs here now.
      #
      # This step queries the live registries, so it fails when reality moves and
      # the committed table does not. That is the intended failure: regenerate
      # with `python3 scripts/gen_published_versions.py` and commit.
      - name: Published-versions table matches the live registries
        run: python3 scripts/gen_published_versions.py --check

      # The recall number is the most load-bearing claim in the README. It used
      # to be typed in as prose, which is how it would rot: nothing tied the
      # 0.689 in the README to the JSON the bench actually wrote. Now the README
      # block is rendered from bench/results/locomo_v1.json and this fails if the
      # two disagree. Offline — it reads the committed result, it does not re-run
      # the bench (that needs a downloaded ONNX model; see #125).
      # Self-test first, same reasoning as the guards above. The branch that
      # matters here is the one that does not run on today's data: when the
      # paired gap FAILS to separate, the README must say so and say what n
      # would be needed. Without a fixture that path would first execute on the
      # day it matters, which is the worst possible day to discover it is wrong.
      # The tag/release parity guard used to live here. It moved to
      # `repo-hygiene.yml` because this job gates the release: `commit-is-green`
      # requires ci.yml green on the tagged commit, and parity fails until the
      # Release exists — which only the release can create. See that workflow's
      # header for the deadlock it caused on v0.5.27.

      - name: Recall-number renderer self-test
        run: python3 scripts/gen_recall_number.py --self-test
      - name: README recall number matches the committed bench result
        run: python3 scripts/gen_recall_number.py --check
