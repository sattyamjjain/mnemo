name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# Notes for maintainers:
# - `mnemo-python` is a PyO3 cdylib that must be built with `maturin`, not
#   `cargo`. Every workspace-wide cargo command excludes it.
# - `mnemo-grpc` needs `protoc`; we install it up front on every job that
#   compiles the workspace.
# - The `onnx` feature of `mnemo-core` builds and tests against the pinned
#   `ort 2.0.0-rc.11` / `ndarray 0.17` / `tokenizers 0.23` API (the migration
#   that repaired the old ndarray-0.16 drift from Dependabot PR #11; issue #125).
#   It is NOT enabled in the workspace-wide clippy/test jobs — not because it is
#   broken, but because `ort` is a heavy native dependency (it compiles ONNX
#   Runtime and downloads its prebuilt library) and would slow every job. It has
#   its own dedicated `onnx` job below (`cargo build`+`test -p mnemo-core
#   --features onnx`) so it can never silently rot again. Default features still
#   cover the entire production surface.
# - `mnemo-golem-wit` is a cdylib WASM component (the golem:vector WIT
#   provider); it is in `[workspace] exclude`, not `members`, because its
#   WASM-only host imports have no native definition and the native cdylib
#   link fails ("Undefined symbols … _cabi_post_mnemo:golem-vector/…"). That
#   is what reddened `cargo build --workspace` from 69a8ca6 (2026-05-21) until
#   it was excluded. Build it standalone (it carries its own `[workspace]`) with
#   `cargo component build --release --manifest-path
#   crates/mnemo-golem-wit/Cargo.toml --target wasm32-wasip2`.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --all-targets --workspace --exclude mnemo-python

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --workspace --exclude mnemo-python

  # Dedicated job for the `onnx` feature. It builds and tests fine against the
  # pinned ort 2.0.0-rc.11 / ndarray 0.17 API, but `ort` compiles ONNX Runtime
  # and downloads a prebuilt native lib, so it is kept out of the workspace-wide
  # jobs (which stay default-features + fast) and exercised here instead. This is
  # the guard that stops the feature silently rotting again (issue #125). It does
  # NOT run end-to-end ONNX inference — that needs a real model on disk
  # (MNEMO_ONNX_MODEL_PATH), exercised by the out-of-tree benches — but it proves
  # the feature compiles, links the native runtime, and its test suite passes.
  onnx-feature:
    name: onnx feature (mnemo-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p mnemo-core --features onnx
      # Fetch a real all-MiniLM-L6-v2 ONNX model (384-dim) so the end-to-end
      # inference test (issue #125) actually exercises tokenize -> ort inference
      # -> mean-pool -> L2-normalise, not just that the feature compiles. Without
      # a model the onnx unit tests only assert that construction errors; a
      # feature that builds but never demonstrably runs is the latent-stub class
      # of bug (cf. the Postgres semantic-recall stub fixed in v0.5.7). The test
      # is gated on MNEMO_ONNX_MODEL_PATH and skips (still green) when it is unset.
      - name: Download all-MiniLM-L6-v2 ONNX (for the end-to-end inference test)
        run: |
          mkdir -p "$RUNNER_TEMP/minilm"
          curl -sSL --retry 3 --retry-delay 5 --fail \
            -o "$RUNNER_TEMP/minilm/model.onnx" \
            https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
          curl -sSL --retry 3 --retry-delay 5 --fail \
            -o "$RUNNER_TEMP/minilm/tokenizer.json" \
            https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/tokenizer.json
      - name: Test onnx feature (real end-to-end inference)
        env:
          MNEMO_ONNX_MODEL_PATH: ${{ runner.temp }}/minilm/model.onnx
        run: cargo test -p mnemo-core --features onnx

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (required by mnemo-grpc build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # mnemo-python is a PyO3 cdylib that won't link without the
      # Python development headers + maturin context. Built separately
      # via the pypi-publish workflow.
      - run: cargo build --workspace --exclude mnemo-python

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  postgres:
    name: Postgres integration (pgvector ANN)
    runs-on: ubuntu-latest
    # Live pgvector database so the MNEMO_TEST_POSTGRES_URL-gated ANN test
    # (crates/mnemo-postgres/tests/pgvector_ann.rs) actually runs instead of
    # skipping — this is the #99 acceptance gate.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MNEMO_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/mnemo_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mnemo-postgres --test pgvector_ann -- --nocapture

  # Fails when the workspace version drifts MORE THAN ONE PATCH ahead of the
  # newest mnemo-core release on crates.io — the forcing function that stops
  # tagged-but-unpublished releases from piling up (see scripts/check_version_drift.sh).
  version-drift:
    name: Version drift (crates.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_version_drift.sh

  # Python test suite. Added 2026-08-15 — until then NOTHING ran pytest, so the
  # 138-test Python suite was unexecuted in CI and had been sitting on two
  # failures nobody could see: a version-alignment test red since 0.5.12, and a
  # real Tantivy LockBusy bug (two MnemoSessionStore on one db_path each opened
  # an IndexWriter). Both are fixed; this job is what stops them recurring.
  #
  # The native extension IS built rather than skipped. The integration tests
  # self-skip when `mnemo._mnemo` is missing, so a pure-Python job would go green
  # while silently not running the very tests that cover the session-store fix —
  # the same "skip is indistinguishable from a pass" failure mode that let
  # mnemo-mcp-server strand for 87 days.
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the native extension (maturin)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path python/Cargo.toml -i python3.12
      - name: Install the wheel + dev extras
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Install the built wheel, then the dev extras (pytest, moto, and the
          # GCS/Azure SDKs the #39 backend tests import-guard on).
          python -m pip install dist/*.whl
          python -m pip install "pytest>=7.0" "pytest-asyncio>=0.23" "moto>=5.0" \
                                "google-cloud-storage>=2.14" "azure-storage-blob>=12.19" \
                                "boto3>=1.34" "cryptography>=42"
      # The native extension is the ENTIRE reason this job builds a wheel instead
      # of running pure-Python. Sixteen tests — every @integration test in
      # test_openai_sessions.py, test_openai_sessions_ga.py and
      # test_write_provenance.py, including
      # `test_sessions_do_not_leak_across_session_ids`, the regression test for
      # the Tantivy LockBusy fix — are gated behind
      # `importlib.util.find_spec("mnemo._mnemo")` and SKIP when it is missing.
      # A skip is green, so a job that lets them skip passes while testing
      # nothing.
      #
      # RUN FROM THE REPOSITORY ROOT, NOT FROM python/. `python -m pytest`
      # prepends its working directory to sys.path. With cwd=python/, the
      # SOURCE package `python/mnemo/` shadows the wheel installed into
      # site-packages — and the source tree carries no compiled `_mnemo`
      # (locally it appears to, only because `maturin develop` copies the .so
      # into it; a wheel install does not). All sixteen therefore skipped on
      # 2026-08-15 while the job reported success.
      #
      # The guard runs in the SAME STEP as pytest, deliberately. As a separate
      # step it ran from the repo root while pytest ran from python/, so it
      # asserted against a different sys.path than the tests used and printed
      # "imports OK" over sixteen skips. Co-locating them is what makes the
      # assertion structurally honest; splitting them re-opens the bug.
      #
      # `-rs` prints the reason for every skip — without it the log is a bare
      # "N passed, M skipped" and a newly-silenced test is invisible in review.
      - name: pytest (with native-extension guard)
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, sys

          FAIL = (
              "mnemo._mnemo is NOT importable from the repository root — the "
              "wheel did not install the native extension, or something is "
              "shadowing it on sys.path. The native-gated tests would silently "
              "skip and this job would pass while testing nothing. Failing."
          )

          # find_spec RAISES ModuleNotFoundError when the PARENT package is
          # missing and only returns None when the parent exists but the
          # submodule does not — so both have to be handled or a totally absent
          # wheel exits with a bare traceback that explains nothing.
          try:
              found = importlib.util.find_spec("mnemo._mnemo") is not None
          except ModuleNotFoundError:
              found = False
          if not found:
              sys.exit(FAIL)

          import mnemo._mnemo  # prove it loads, not just that it resolves
          print(f"mnemo._mnemo imports OK from {mnemo._mnemo.__file__}")
          PY

          python -m pytest python/tests/ -q -rs --import-mode=importlib \
            | tee "$RUNNER_TEMP/pytest.log"

          # The import check above proves only what the GUARD can see. This
          # asserts what the TESTS actually did: if any test skipped because the
          # native extension was missing, the wheel is not reaching pytest and
          # the run is not covering the native path — regardless of the guard.
          #
          # Deliberately matches only the "native extension not built" reasons
          # (test_openai_sessions*.py, test_write_provenance.py). It does NOT
          # match test_claude_agent_sdk.py, which additionally needs
          # OPENAI_API_KEY and so skips here legitimately.
          if grep -q "native extension not built" "$RUNNER_TEMP/pytest.log"; then
            echo "::error::Tests skipped for a missing native extension:"
            grep "native extension not built" "$RUNNER_TEMP/pytest.log" >&2
            exit 1
          fi

  # OFFLINE workspace version fence — every crate's Cargo.toml, every internal
  # dependency pin, the newest git tag and the CHANGELOG must agree on ONE
  # version. Three numbers coexisted before this existed (workspace 0.5.23,
  # mnemo-golem-wit 0.5.21, newest tag v0.5.22).
  #
  # This runs as its own job ONLY because it needs `fetch-depth: 0`: the default
  # shallow checkout fetches no tags, and the fence's tag legs skip themselves
  # rather than fail when no tags are reachable (a fence that fails because the
  # checkout has no tags is testing the checkout, not the repo). The plain `test`
  # job also runs these tests — it just cannot exercise the tag legs.
  version-fence:
    name: Workspace version fence (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mnemo-mcp-server --test workspace_version_fence
