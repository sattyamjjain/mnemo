name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch new advisories published against pinned deps even without a
    # code change. Runs at 04:07 UTC — off the main CI hot hour.
    - cron: "7 4 * * *"
  workflow_dispatch:

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit
        # Exits non-zero on any advisory not listed in .cargo/audit.toml.
        # That file must carry a rationale + owner for every entry — see
        # `chore: update audit.toml ignores` commits for the convention.
        run: cargo audit

  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny check advisories
        # The advisories check is the only one we gate on today — duplicate
        # detection and licence classification need their own config file
        # (tracked as a follow-up, not this PR). `--hide-inclusion-graph`
        # keeps the CI log readable on a clean pass.
        run: cargo deny --workspace check advisories --hide-inclusion-graph

  agent-audit-kit:
    # Static MCP / agent-config security scan (secrets, tool-poisoning, auth
    # bypass, path-traversal/SSRF, supply-chain CVEs) over mnemo's MCP-server
    # surface, agent configs, and supply-chain manifests. Complements the two
    # jobs above — cargo-audit / cargo-deny cover Rust *crate* advisories; this
    # covers the *MCP / agent / config* attack surface that `mnemo-mcp` exposes.
    # Deterministic, offline scanner (271 rules): https://github.com/sattyamjjain/agent-audit-kit
    #
    # Observe-first rollout: gates only on `critical` (config: .agent-audit-kit.yml),
    # but uploads SARIF for every severity so highs/mediums are visible in the
    # Security tab. Tighten `fail-on` to `high` after the first triage.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to GitHub Code Scanning
      pull-requests: write # sticky PR comment summarising findings
    steps:
      - uses: actions/checkout@v7

      - name: AgentAuditKit MCP security scan
        # Pinned to v0.3.79 (2026-08-15, the current release). This jumps
        # straight past the stale Dependabot PR #157 (0.3.68 -> 0.3.74), which
        # was already five releases behind when it opened — merging a stale
        # intermediate buys another bump immediately and re-runs this triage for
        # nothing.
        #
        # VERIFIED, not assumed. 0.3.68 and 0.3.79 were both run against this
        # repo with the CI parameters (--config .agent-audit-kit.yml --severity
        # low --fail-on critical) on 2026-08-16. Rules evaluated went 275 -> 303,
        # and the finding set was IDENTICAL: same rule IDs, same locations, same
        # counts, 0 critical, exit 0 on both. 28 new rules, zero new findings on
        # mnemo. Nothing needed fixing, so nothing was pinned back.
        #
        # The gate stays `fail-on: critical` with the .agent-audit-kit.yml
        # suppression baseline (e.g. the AAK-AGENT-001 CLAUDE.md false positive).
        # If a future rule surfaces a NEW critical, this job fails loudly and the
        # baseline must be re-derived — that is the intended signal, not a reason
        # to unpin. Reproduce the comparison locally with:
        #   pipx run --spec agent-audit-kit==0.3.79 aak scan . \
        #     --config .agent-audit-kit.yml --severity low --fail-on critical
        uses: sattyamjjain/agent-audit-kit@v0.3.79
        with:
          path: .
          config: .agent-audit-kit.yml
          severity: low
          fail-on: critical
          format: sarif
          upload-sarif: true
          comment-on-pr: true
