[package]
name = "mnemo-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server interface for Mnemo memory database"
readme = "README.md"
keywords = ["mcp", "memory", "ai-agents", "llm", "database"]
categories = ["api-bindings", "database"]
documentation.workspace = true

[dependencies]
mnemo-core = { workspace = true }
mnemo-compliance = { workspace = true }
mnemo-attention-state = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
http = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
mnemo-attention-state = { workspace = true }
# `client` is dev-only: `explicit_handle_roundtrip` drives the real
# `tools/call` wire path with an in-process rmcp client rather than reaching
# into the crate, because the `#[tool]` macro generates private methods and a
# test that called them would not prove anything about the surface a client
# actually sees. Consumers of `mnemo-mcp` do not get this feature.
rmcp = { workspace = true, features = ["client"] }
