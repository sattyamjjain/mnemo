[package]
# Published as `mnemo-mcp-server` because `mnemo-cli` is owned on
# crates.io by github.com/watzon/mnemo (a different LLM-memory-proxy
# project). The directory stays `crates/mnemo-cli/` and the installed
# binary stays `mnemo` — only the published package name moves.
name = "mnemo-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mnemo MCP memory server — runnable binary; install as `cargo install mnemo-mcp-server`, run as `mnemo`."

[[bin]]
name = "mnemo"
path = "src/main.rs"

[dependencies]
mnemo-core = { workspace = true }
mnemo-mcp = { workspace = true }
mnemo-compliance = { workspace = true }
mnemo-rest = { workspace = true, optional = true }
mnemo-admin = { workspace = true, optional = true }
mnemo-pgwire = { workspace = true, optional = true }
mnemo-grpc = { workspace = true, optional = true }
mnemo-postgres = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rmcp = { workspace = true }
serde_json = { workspace = true }

# v0.4.0-rc3 (Task B2) — mnemo-mcp-server safe-spawn plumbing.
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
toml = "1.1"
hex = { workspace = true }

# v0.4.0 (P0-1) — MCP tool-catalog attestation.
sha2 = { workspace = true }
chrono = { workspace = true }

# v0.4.9 — `mnemo bench embeddings --slo-ms <N>` subcommand. Path-only
# dep for the `bench embeddings` subcommand. It is now a published crate with a
# workspace version pin, so this binary is itself publishable (it was stranded at
# 0.4.4 when this was a bare path dep that cargo publish rejects).
mnemo-embeddings-bench = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["rest"]
rest = ["dep:mnemo-rest", "dep:axum"]
# Authenticated Streamable HTTP transport for MCP (ADR 0002 / #126).
# stdio stays the default transport; this only adds `--http-port`.
http-transport = ["rmcp/transport-streamable-http-server", "dep:axum"]
admin = ["dep:mnemo-admin"]
pgwire = ["dep:mnemo-pgwire"]
grpc = ["dep:mnemo-grpc"]
postgres = ["dep:mnemo-postgres"]
